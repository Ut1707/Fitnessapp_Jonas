<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Training</title>
<style>
:root{
  --bg:#ffffff;
  --fg:#16181d;
  --muted:#71757e;
  --line:#e4e6ea;
  --soft:#f5f6f8;
  --accent:#2f6feb;
  --accent-soft:#e8effd;
  --danger:#c2413a;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#131417;
    --fg:#e9eaec;
    --muted:#8e939c;
    --line:#2a2c31;
    --soft:#1b1d21;
    --accent:#6fa0ff;
    --accent-soft:#1e2942;
    --danger:#e0736b;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--fg);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}

.wrap{max-width:620px;margin:0 auto;padding:0 16px 64px}

/* ---------- Kopf ---------- */
header{
  position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.head-in{max-width:620px;margin:0 auto;padding:12px 16px 0}
.profiles{display:flex;gap:6px;background:var(--soft);padding:4px;border-radius:var(--radius)}
.profiles button{
  flex:1;padding:9px 8px;border:0;background:transparent;border-radius:7px;
  color:var(--muted);font-weight:500;
}
.profiles button[aria-pressed="true"]{background:var(--bg);color:var(--fg);font-weight:600;box-shadow:0 0 0 1px var(--line)}
nav{display:flex;gap:22px;margin-top:12px}
nav button{
  border:0;background:none;padding:10px 0;color:var(--muted);
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
nav button[aria-current="page"]{color:var(--fg);border-bottom-color:var(--fg);font-weight:600}

/* ---------- Bausteine ---------- */
h2{font-size:17px;font-weight:600;margin:26px 0 10px}
h2:first-child{margin-top:20px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{
  border:1px solid var(--line);background:var(--bg);color:var(--fg);
  padding:9px 14px;border-radius:var(--radius);
}
.btn:active{background:var(--soft)}
.btn-primary{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
.btn-ghost{border:0;background:none;color:var(--accent);padding:8px 0}
.btn-danger{color:var(--danger);border:0;background:none;padding:8px 0}
.btn-sm{padding:5px 10px;font-size:14px;border-radius:8px}
.btn-block{display:block;width:100%;text-align:center}

label{display:block;font-size:13px;color:var(--muted);margin:0 0 5px}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--bg);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
textarea{resize:vertical;min-height:64px}
.field{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.empty{color:var(--muted);font-size:14px;padding:18px 0;text-align:center}

/* ---------- Kalender ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:18px 0 12px}
.cal-head strong{font-size:17px;font-weight:600}
.cal-nav{border:1px solid var(--line);background:var(--bg);width:34px;height:34px;border-radius:8px;line-height:1}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
.dow span{text-align:center;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal button{
  position:relative;min-height:46px;padding-bottom:8px;border:0;background:none;border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:15px;
}
.cal button.out{color:transparent;pointer-events:none}
.cal button.today{font-weight:700;box-shadow:inset 0 0 0 1px var(--line)}
.cal button[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:600}
.cal button[aria-pressed="true"] .dots i{background:var(--bg)}
.dots{position:absolute;bottom:6px;display:flex;gap:3px}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--accent);display:block}

.day-panel{border-top:1px solid var(--line);margin-top:18px;padding-top:14px}

/* ---------- Listen ---------- */
.item{
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding:12px 0;border-bottom:1px solid var(--line);
}
.item:last-child{border-bottom:0}
.item .txt{min-width:0}
.item .t1{font-weight:600}
.item .t2{font-size:13.5px;color:var(--muted);margin-top:2px}
.chev{border:0;background:none;color:var(--muted);padding:4px 0 4px 8px;flex:none}

/* ---------- Dashboard ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.stat{background:var(--bg);padding:14px}
.stat .v{font-size:22px;font-weight:600;letter-spacing:-.01em}
.stat .k{font-size:12.5px;color:var(--muted);margin-top:2px}
.chart{width:100%;height:110px;display:block;margin-top:6px}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--accent)}

/* ---------- Modal ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;
  display:none;align-items:flex-end;justify-content:center;
}
.overlay.open{display:flex}
.sheet{
  background:var(--bg);width:100%;max-width:620px;max-height:92vh;overflow:auto;
  border-radius:16px 16px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));
}
@media (min-width:640px){
  .overlay{align-items:center}
  .sheet{border-radius:14px;max-height:88vh}
}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sheet-head h3{margin:0;font-size:17px;font-weight:600}
.x{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:0 4px}

.pick{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);
  padding:12px 14px;border-radius:var(--radius);margin-bottom:8px}
.pick:active{background:var(--soft)}
.pick .p2{font-size:13px;color:var(--muted);margin-top:2px}
.sec-title{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:20px 0 8px}
.sec-title:first-child{margin-top:0}

/* ---------- Satz-Eingabe ---------- */
.exblock{border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px}
.exblock .exhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.exblock .exhead .name{font-weight:600}
.setrow{display:grid;grid-template-columns:22px 1fr 1fr 30px;gap:8px;align-items:center;margin-bottom:6px}
.setrow .n{font-size:13px;color:var(--muted);text-align:center}
.setrow input{padding:8px 10px;text-align:center}
.setrow .del{border:0;background:none;color:var(--muted);font-size:18px;line-height:1}
.setlabels{display:grid;grid-template-columns:22px 1fr 1fr 30px;gap:8px;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.setlabels span{text-align:center}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:99;
  background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;
  opacity:0;pointer-events:none;transition:opacity .18s;
}
.toast.show{opacity:1}
.hint{font-size:12.5px;color:var(--muted);margin-top:5px}
.foot{margin-top:38px;padding-top:16px;border-top:1px solid var(--line);display:flex;gap:16px;flex-wrap:wrap}
</style>
</head>
<body>

<header>
  <div class="head-in">
    <div class="profiles" id="profiles"></div>
    <nav id="nav">
      <button data-v="cal" aria-current="page">Kalender</button>
      <button data-v="body">Körper</button>
      <button data-v="dash">Dashboard</button>
    </nav>
  </div>
</header>

<main class="wrap" id="main"></main>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ============================================================
   Daten
   ============================================================ */

const KEY = 'ff_v1';

const PROFILES = [
  { id:'franca', name:'Franca' },
  { id:'jonas',  name:'Jonas' }
];

function defaults(){
  return {
    version: 1,
    profile: 'jonas',
    cardio: [
      { id:'c1', name:'Laufen' },
      { id:'c2', name:'Radfahren' },
      { id:'c3', name:'Schwimmen' },
      { id:'c4', name:'Rudern' },
      { id:'c5', name:'Walken' }
    ],
    plans: [
      { id:'p1', name:'Beine', exercises:[
        'Kniebeuge','Beinpresse','Rumänisches Kreuzheben','Beinstrecker','Beinbeuger','Wadenheben'] },
      { id:'p2', name:'Push (Brust, Schulter, Trizeps)', exercises:[
        'Bankdrücken','Schrägbank Kurzhantel','Schulterdrücken','Seitheben','Trizepsdrücken Kabel','Dips'] },
      { id:'p3', name:'Pull (Rücken, Bizeps)', exercises:[
        'Klimmzüge','Latzug','Rudern Langhantel','Rudern Kabel eng','Reverse Butterfly','Bizepscurls'] },
      { id:'p4', name:'Ganzkörper', exercises:[
        'Kreuzheben','Kniebeuge','Bankdrücken','Rudern Langhantel','Schulterdrücken','Plank'] }
    ],
    custom: [],          // { id, name, kind: 'cardio' | 'strength' | 'simple', exercises:[] }
    entries: [],         // s. u.
    body: []             // { id, profile, date, weight, chest, waist, hips, thigh, arm }
  };
}

let S = load();
let view = 'cal';
let calMonth = new Date();  calMonth.setDate(1);
let selDate = dkey(new Date());
let draft = null;           // aktueller Eintrag im Formular

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return defaults();
    const d = JSON.parse(raw);
    const base = defaults();
    return Object.assign(base, d);
  }catch(e){
    return defaults();
  }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('Speichern fehlgeschlagen'); }
}

/* ============================================================
   Helfer
   ============================================================ */

const $ = s => document.querySelector(s);
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function pad(n){ return String(n).padStart(2,'0'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function dkey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fromKey(k){ const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); }
function dLabel(k){
  const d = fromKey(k);
  return d.toLocaleDateString('de-DE', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}
function dShort(k){
  return fromKey(k).toLocaleDateString('de-DE', { day:'2-digit', month:'2-digit', year:'2-digit' });
}

function num(v){ const n = parseFloat(String(v==null?'':v).replace(',','.')); return isFinite(n) ? n : null; }
function fmtNum(n, dec){
  if(n==null) return '–';
  return n.toLocaleString('de-DE', { minimumFractionDigits:dec||0, maximumFractionDigits:dec||0 });
}

/** "45" -> 45 min, "32:15" -> mm:ss, "1:05:30" -> hh:mm:ss. Ergebnis in Sekunden. */
function parseDur(str){
  if(!str) return null;
  const parts = String(str).trim().split(':').map(p => p.trim());
  if(parts.some(p => p !== '' && isNaN(Number(p.replace(',','.'))))) return null;
  const n = parts.map(p => p === '' ? 0 : Math.abs(Number(p.replace(',','.'))));
  if(n.length === 1) return Math.round(n[0]*60);
  if(n.length === 2) return Math.round(n[0]*60 + n[1]);
  if(n.length === 3) return Math.round(n[0]*3600 + n[1]*60 + n[2]);
  return null;
}
function fmtDur(sec){
  if(sec==null) return '–';
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = Math.round(sec%60);
  return h ? h+':'+pad(m)+':'+pad(s) : m+':'+pad(s);
}
function pace(sec, km){
  if(!sec || !km) return null;
  const p = sec/km;
  return Math.floor(p/60)+':'+pad(Math.round(p%60));
}

function toast(msg){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> t.classList.remove('show'), 1900);
}

function openSheet(html){
  $('#sheet').innerHTML = html;
  $('#overlay').classList.add('open');
  $('#sheet').scrollTop = 0;
}
function closeSheet(){
  $('#overlay').classList.remove('open');
  $('#sheet').innerHTML = '';
  draft = null;
}
$('#overlay').addEventListener('click', e => { if(e.target === $('#overlay')) closeSheet(); });

function sheetHead(title){
  return '<div class="sheet-head"><h3>'+esc(title)+'</h3>'+
         '<button class="x" data-act="close" aria-label="Schließen">&times;</button></div>';
}

/* ---- Kategorien ---- */

function allCats(){
  const out = [];
  S.cardio.forEach(c => out.push({ id:c.id, name:c.name, kind:'cardio', group:'Cardio' }));
  S.plans.forEach(p => out.push({ id:p.id, name:p.name, kind:'strength', group:'Fitness', exercises:p.exercises }));
  S.custom.forEach(c => out.push({ id:c.id, name:c.name, kind:c.kind, group:'Weitere', exercises:c.exercises||[] }));
  return out;
}
function catById(id){ return allCats().find(c => c.id === id); }

function myEntries(){ return S.entries.filter(e => e.profile === S.profile); }
function entriesOn(key){ return myEntries().filter(e => e.date === key); }
function myBody(){ return S.body.filter(b => b.profile === S.profile).slice().sort((a,b)=> a.date < b.date ? 1 : -1); }

function volume(e){
  if(e.kind !== 'strength') return 0;
  let v = 0;
  (e.blocks||[]).forEach(b => (b.sets||[]).forEach(s => {
    const r = num(s.reps), w = num(s.weight);
    if(r && w) v += r*w;
  }));
  return v;
}
function setCount(e){
  let n = 0;
  (e.blocks||[]).forEach(b => n += (b.sets||[]).filter(s => num(s.reps)).length);
  return n;
}

function entryTitle(e){ return e.cat; }
function entrySub(e){
  if(e.kind === 'cardio'){
    const bits = [];
    if(e.distance) bits.push(fmtNum(e.distance,1)+' km');
    if(e.duration) bits.push(fmtDur(e.duration));
    const p = pace(e.duration, e.distance);
    if(p) bits.push(p+' /km');
    return bits.join(' · ') || 'Cardio';
  }
  if(e.kind === 'strength'){
    const ex = (e.blocks||[]).filter(b => (b.sets||[]).some(s => num(s.reps))).length;
    const v = volume(e);
    const bits = [ex+' Übung'+(ex===1?'':'en'), setCount(e)+' Sätze'];
    if(v) bits.push(fmtNum(v,0)+' kg gesamt');
    return bits.join(' · ');
  }
  const bits = [];
  if(e.duration) bits.push(fmtDur(e.duration));
  if(e.note) bits.push(e.note);
  return bits.join(' · ') || 'Eintrag';
}

/* ============================================================
   Kopfzeile
   ============================================================ */

function renderHead(){
  $('#profiles').innerHTML = PROFILES.map(p =>
    '<button data-p="'+p.id+'" aria-pressed="'+(S.profile===p.id)+'">'+esc(p.name)+'</button>'
  ).join('');
  document.querySelectorAll('#nav button').forEach(b => {
    if(b.dataset.v === view) b.setAttribute('aria-current','page');
    else b.removeAttribute('aria-current');
  });
}
$('#profiles').addEventListener('click', e => {
  const b = e.target.closest('button[data-p]'); if(!b) return;
  S.profile = b.dataset.p; save(); render();
});
$('#nav').addEventListener('click', e => {
  const b = e.target.closest('button[data-v]'); if(!b) return;
  view = b.dataset.v; render(); window.scrollTo(0,0);
});

/* ============================================================
   Ansicht: Kalender
   ============================================================ */

function renderCal(){
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const title = calMonth.toLocaleDateString('de-DE', { month:'long', year:'numeric' });

  const first = new Date(y, m, 1);
  const lead = (first.getDay() + 6) % 7;           // Montag = 0
  const days = new Date(y, m+1, 0).getDate();
  const todayK = dkey(new Date());

  const counts = {};
  myEntries().forEach(e => counts[e.date] = (counts[e.date]||0) + 1);

  let cells = '';
  for(let i=0;i<lead;i++) cells += '<button class="out" tabindex="-1"></button>';
  for(let d=1; d<=days; d++){
    const k = y+'-'+pad(m+1)+'-'+pad(d);
    const n = Math.min(counts[k]||0, 3);
    const dots = n ? '<span class="dots">'+'<i></i>'.repeat(n)+'</span>' : '';
    cells += '<button data-day="'+k+'" aria-pressed="'+(k===selDate)+'"'+
             (k===todayK?' class="today"':'')+'>'+d+dots+'</button>';
  }

  const list = entriesOn(selDate);
  const dayHtml = list.length
    ? list.map(e =>
        '<div class="item"><div class="txt">'+
        '<div class="t1">'+esc(entryTitle(e))+'</div>'+
        '<div class="t2">'+esc(entrySub(e))+'</div>'+
        '</div><button class="chev" data-edit="'+e.id+'" aria-label="Bearbeiten">Bearbeiten</button></div>'
      ).join('')
    : '<div class="empty">Kein Training an diesem Tag.</div>';

  return ''+
  '<div class="cal-head">'+
    '<button class="cal-nav" data-mon="-1" aria-label="Vorheriger Monat">‹</button>'+
    '<strong>'+esc(title)+'</strong>'+
    '<button class="cal-nav" data-mon="1" aria-label="Nächster Monat">›</button>'+
  '</div>'+
  '<div class="dow"><span>Mo</span><span>Di</span><span>Mi</span><span>Do</span><span>Fr</span><span>Sa</span><span>So</span></div>'+
  '<div class="cal" id="cal">'+cells+'</div>'+
  '<div class="day-panel">'+
    '<div class="spread"><strong>'+esc(dLabel(selDate))+'</strong></div>'+
    dayHtml+
    '<button class="btn btn-primary btn-block" data-act="new" style="margin-top:14px">+ Training eintragen</button>'+
    '<button class="btn-ghost" data-act="manage" style="margin-top:6px">Kategorien &amp; Übungen bearbeiten</button>'+
  '</div>';
}

/* ============================================================
   Ansicht: Körper
   ============================================================ */

function renderBody(){
  const list = myBody();
  const rows = list.length
    ? list.map(b => {
        const bits = [];
        if(b.weight) bits.push(fmtNum(num(b.weight),1)+' kg');
        [['chest','Brust'],['waist','Taille'],['hips','Hüfte'],['thigh','Oberschenkel'],['arm','Arm']]
          .forEach(([k,l]) => { if(b[k]) bits.push(l+' '+fmtNum(num(b[k]),1)+' cm'); });
        return '<div class="item"><div class="txt">'+
               '<div class="t1">'+esc(dShort(b.date))+'</div>'+
               '<div class="t2">'+esc(bits.join(' · ') || 'Keine Werte')+'</div>'+
               '</div><button class="chev" data-bedit="'+b.id+'">Bearbeiten</button></div>';
      }).join('')
    : '<div class="empty">Noch keine Messung erfasst.</div>';

  return '<h2>Körper</h2>'+
    '<button class="btn btn-primary btn-block" data-act="newbody">+ Messung eintragen</button>'+
    '<h2>Verlauf</h2>'+ rows;
}

/* ============================================================
   Ansicht: Dashboard
   ============================================================ */

function startOfWeek(d){
  const x = new Date(d); x.setHours(0,0,0,0);
  x.setDate(x.getDate() - ((x.getDay()+6)%7));
  return x;
}

function renderDash(){
  const es = myEntries();
  const now = new Date();
  const wk = dkey(startOfWeek(now));
  const monPrefix = now.getFullYear()+'-'+pad(now.getMonth()+1);

  const week  = es.filter(e => e.date >= wk);
  const month = es.filter(e => e.date.startsWith(monPrefix));

  const km  = month.filter(e => e.kind==='cardio').reduce((a,e)=> a + (num(e.distance)||0), 0);
  const vol = month.reduce((a,e)=> a + volume(e), 0);

  const body = myBody();
  const cur = body.find(b => num(b.weight));
  let delta = null;
  if(cur){
    const prev = body.filter(b => num(b.weight) && b.date < cur.date)[0];
    if(prev) delta = num(cur.weight) - num(prev.weight);
  }

  const stats =
    '<div class="stats">'+
      '<div class="stat"><div class="v">'+week.length+'</div><div class="k">Einheiten diese Woche</div></div>'+
      '<div class="stat"><div class="v">'+month.length+'</div><div class="k">Einheiten diesen Monat</div></div>'+
      '<div class="stat"><div class="v">'+fmtNum(km,1)+'</div><div class="k">km diesen Monat</div></div>'+
      '<div class="stat"><div class="v">'+fmtNum(vol,0)+'</div><div class="k">kg bewegt diesen Monat</div></div>'+
    '</div>';

  let weightBox = '<div class="empty">Noch kein Gewicht erfasst.</div>';
  if(cur){
    const d = delta==null ? '' :
      ' <span class="small muted">('+(delta>0?'+':'−')+fmtNum(Math.abs(delta),1)+' kg zur letzten Messung)</span>';
    weightBox = '<div style="font-size:22px;font-weight:600">'+fmtNum(num(cur.weight),1)+' kg'+d+'</div>'+
                '<div class="small muted">Stand '+esc(dShort(cur.date))+'</div>'+
                weightChart(body);
  }

  const last = es.slice().sort((a,b)=> a.date < b.date ? 1 : -1).slice(0,5);
  const lastHtml = last.length
    ? last.map(e => '<div class="item"><div class="txt">'+
        '<div class="t1">'+esc(entryTitle(e))+'</div>'+
        '<div class="t2">'+esc(dShort(e.date)+' · '+entrySub(e))+'</div></div></div>').join('')
    : '<div class="empty">Noch keine Einträge.</div>';

  return '<h2>Überblick</h2>'+stats+
         '<h2>Gewicht</h2>'+weightBox+
         '<h2>Zuletzt</h2>'+lastHtml+
         '<div class="foot">'+
           '<button class="btn-ghost" data-act="export">Daten sichern</button>'+
           '<button class="btn-ghost" data-act="import">Sicherung einlesen</button>'+
         '</div>';
}

function weightChart(body){
  const pts = body.filter(b => num(b.weight)).slice(0,14).reverse();
  if(pts.length < 2) return '';
  const vals = pts.map(b => num(b.weight));
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = (max-min) || 1;
  const W = 100, H = 40, pad = 4;
  const xy = vals.map((v,i) => {
    const x = pts.length===1 ? W/2 : (i/(pts.length-1))*(W-2*pad)+pad;
    const y = H-pad - ((v-min)/span)*(H-2*pad);
    return [x, y];
  });
  const line = xy.map(p => p[0].toFixed(2)+','+p[1].toFixed(2)).join(' ');
  const dots = xy.map(p => '<circle class="pt" cx="'+p[0].toFixed(2)+'" cy="'+p[1].toFixed(2)+'" r="1.1"/>').join('');
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">'+
         '<polyline class="ln" points="'+line+'" vector-effect="non-scaling-stroke"/>'+dots+'</svg>'+
         '<div class="small muted">'+fmtNum(min,1)+' – '+fmtNum(max,1)+' kg · letzte '+pts.length+' Messungen</div>';
}

  const cats = allCats();
  const groups = ['Cardio','Fitness','Weitere'];

/* ============================================================

function newDraft(cat){
  const d = { id:uid(), profile:S.profile, date:selDate, kind:cat.kind, catId:cat.id, cat:cat.name, note:'' };
  if(cat.kind === 'strength'){
    const last = myEntries().filter(e => e.catId === cat.id)
      .sort((a,b)=> a.date < b.date ? 1 : -1)[0];
    const prev = {};
    (last && last.blocks || []).forEach(b => prev[b.exercise] = (b.sets||[]).map(s => ({ reps:s.reps, weight:s.weight })));

    // Übungen des Trainings, danach alles, was letztes Mal zusätzlich dabei war
    const names = (cat.exercises||[]).slice();
    Object.keys(prev).forEach(n => { if(!names.includes(n)) names.push(n); });
    if(!names.length) names.push('Übung 1');

    d.blocks = names.map(n => ({
      exercise: n,
      sets: prev[n] && prev[n].length ? prev[n] : [{ reps:'', weight:'' }]
    }));
    d.prefilled = Object.keys(prev).length > 0;
  }
  return d;
}

function openEntry(d, isNew){
  draft = d;
  let body = '';

  if(d.kind === 'cardio'){
    body =
      '<div class="grid2">'+
        '<div class="field"><label for="f-dist">Distanz (km)</label>'+
          '<input id="f-dist" type="text" inputmode="decimal" value="'+esc(d.distance||'')+'" data-f="distance"></div>'+
        '<div class="field"><label for="f-dur">Dauer</label>'+
          '<input id="f-dur" type="text" inputmode="numeric" placeholder="32:15" value="'+esc(d.durText||(d.duration?fmtDur(d.duration):''))+'" data-f="durText"></div>'+
      '</div>'+
      '<div class="field"><div class="hint" id="pace-hint"></div></div>';
  }
  else if(d.kind === 'strength'){
    body = '<div id="blocks">'+renderBlocks(d)+'</div>'+
           '<button class="btn btn-sm" data-act="addex" style="margin-bottom:14px">+ Übung</button>'+
           (d.prefilled && isNew ? '<div class="hint" style="margin:-8px 0 14px">Werte vom letzten Mal vorausgefüllt.</div>' : '');
  }
  else{
    body =
      '<div class="field"><label for="f-dur">Dauer</label>'+
      '<input id="f-dur" type="text" inputmode="numeric" placeholder="45:00" value="'+esc(d.durText||(d.duration?fmtDur(d.duration):''))+'" data-f="durText"></div>';
  }

  const html = sheetHead(d.cat)+
    '<div class="field"><label for="f-date">Datum</label>'+
      '<input id="f-date" type="date" value="'+esc(d.date)+'" data-f="date"></div>'+
    body+
    '<div class="field"><label for="f-note">Notiz</label>'+
      '<textarea id="f-note" data-f="note">'+esc(d.note||'')+'</textarea></div>'+
    '<button class="btn btn-primary btn-block" data-act="saveentry">Speichern</button>'+
    (isNew ? '' : '<button class="btn-danger btn-block" data-act="delentry" style="margin-top:10px">Eintrag löschen</button>');

  openSheet(html);
  if(d.kind === 'cardio') updatePace();
}

function renderBlocks(d){
  return (d.blocks||[]).map((b,bi) =>
    '<div class="exblock">'+
      '<div class="exhead"><span class="name">'+esc(b.exercise)+'</span>'+
        '<button class="btn-danger btn-sm" data-act="delex" data-b="'+bi+'">Entfernen</button></div>'+
      '<div class="setlabels"><span></span><span>Wdh.</span><span>Gewicht (kg)</span><span></span></div>'+
      (b.sets||[]).map((s,si) =>
        '<div class="setrow">'+
          '<span class="n">'+(si+1)+'</span>'+
          '<input type="text" inputmode="numeric" value="'+esc(s.reps||'')+'" data-b="'+bi+'" data-s="'+si+'" data-sf="reps" aria-label="Wiederholungen Satz '+(si+1)+'">'+
          '<input type="text" inputmode="decimal" value="'+esc(s.weight||'')+'" data-b="'+bi+'" data-s="'+si+'" data-sf="weight" aria-label="Gewicht Satz '+(si+1)+'">'+
          '<button class="del" data-act="delset" data-b="'+bi+'" data-s="'+si+'" aria-label="Satz löschen">&minus;</button>'+
        '</div>').join('')+
      '<button class="btn btn-sm" data-act="addset" data-b="'+bi+'">+ Satz</button>'+
    '</div>').join('');
}

function updatePace(){
  const h = $('#pace-hint'); if(!h || !draft) return;
  const km = num(draft.distance), sec = parseDur(draft.durText);
  const p = pace(sec, km);
  h.textContent = p ? 'Pace: '+p+' min/km' : 'Distanz und Dauer eintragen für die Pace.';
}

function saveEntry(){
  const d = draft; if(!d) return;
  if(d.kind === 'cardio'){
    d.distance = num(d.distance);
    d.duration = parseDur(d.durText);
    if(d.durText && d.duration == null){ toast('Dauer bitte als 32:15 eingeben'); return; }
  }
  if(d.kind === 'simple'){
    d.duration = parseDur(d.durText);
  }
  if(d.kind === 'strength'){
    d.blocks = (d.blocks||[]).map(b => ({
      exercise: b.exercise,
      sets: (b.sets||[]).filter(s => String(s.reps).trim() !== '' || String(s.weight).trim() !== '')
    })).filter(b => b.sets.length);
    if(!d.blocks.length){ toast('Mindestens einen Satz eintragen'); return; }
  }
  delete d.durText; delete d.prefilled;

  const i = S.entries.findIndex(e => e.id === d.id);
  if(i >= 0) S.entries[i] = d; else S.entries.push(d);
  selDate = d.date;
  calMonth = fromKey(d.date); calMonth.setDate(1);
  save(); closeSheet(); render(); toast('Gespeichert');
}

/* ============================================================
   Körper-Formular
   ============================================================ */

const BODY_FIELDS = [
  ['weight','Gewicht (kg)'],
  ['chest','Brust (cm)'],
  ['waist','Taille (cm)'],
  ['hips','Hüfte (cm)'],
  ['thigh','Oberschenkel (cm)'],
  ['arm','Arm (cm)']
];

function openBody(b, isNew){
  draft = b;
  const fields = BODY_FIELDS.map(([k,l]) =>
    '<div class="field"><label for="b-'+k+'">'+l+'</label>'+
    '<input id="b-'+k+'" type="text" inputmode="decimal" value="'+esc(b[k]||'')+'" data-f="'+k+'"></div>'
  );
  const html = sheetHead(isNew ? 'Messung eintragen' : 'Messung bearbeiten')+
    '<div class="field"><label for="b-date">Datum</label>'+
      '<input id="b-date" type="date" value="'+esc(b.date)+'" data-f="date"></div>'+
    '<div class="grid2">'+fields.join('')+'</div>'+
    '<div class="hint" style="margin-bottom:14px">Leere Felder werden einfach nicht gespeichert.</div>'+
    '<button class="btn btn-primary btn-block" data-act="savebody">Speichern</button>'+
    (isNew ? '' : '<button class="btn-danger btn-block" data-act="delbody" style="margin-top:10px">Messung löschen</button>');
  openSheet(html);
}

function saveBody(){
  const b = draft; if(!b) return;
  const has = BODY_FIELDS.some(([k]) => String(b[k]||'').trim() !== '');
  if(!has){ toast('Mindestens einen Wert eintragen'); return; }
  BODY_FIELDS.forEach(([k]) => { if(String(b[k]||'').trim() === '') delete b[k]; });
  const i = S.body.findIndex(x => x.id === b.id);
  if(i >= 0) S.body[i] = b; else S.body.push(b);
  save(); closeSheet(); render(); toast('Gespeichert');
}

  const html = sheetHead('Neue Kategorie')+

  setTimeout(()=> $('#nc-name') && $('#nc-name').focus(), 50);

/* ============================================================
   Sicherung
   ============================================================ */

function exportData(){
  const blob = new Blob([JSON.stringify(S, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'training-sicherung-'+dkey(new Date())+'.json';
  a.click();
  setTimeout(()=> URL.revokeObjectURL(a.href), 1000);
}
function importData(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = () => {
    const f = inp.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const d = JSON.parse(r.result);
        if(!d || !Array.isArray(d.entries)) throw new Error('Format');
        if(!window.confirm('Sicherung einlesen? Alle aktuellen Daten auf diesem Gerät werden ersetzt.')) return;
        S = Object.assign(defaults(), d);
        save(); render(); toast('Sicherung eingelesen');
      }catch(e){ toast('Datei konnte nicht gelesen werden'); }
    };
    r.readAsText(f);
  };
  inp.click();
}

/* ============================================================
   Ereignisse
   ============================================================ */

/* Hauptbereich */
$('#main').addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-day],[data-mon],[data-edit],[data-bedit]');
  if(!t) return;

  if(t.dataset.mon){
    calMonth.setMonth(calMonth.getMonth() + Number(t.dataset.mon));
    render(); return;
  }
  if(t.dataset.day){ selDate = t.dataset.day; render(); return; }
  if(t.dataset.edit){
    const en = S.entries.find(x => x.id === t.dataset.edit);
    if(en) openEntry(JSON.parse(JSON.stringify(en)), false);
    return;
  }
  if(t.dataset.bedit){
    const b = S.body.find(x => x.id === t.dataset.bedit);
    if(b) openBody(JSON.parse(JSON.stringify(b)), false);
    return;
  }

  switch(t.dataset.act){
    case 'new':      openPicker(); break;
    case 'manage':   openManage(); break;
    case 'newbody':  openBody({ id:uid(), profile:S.profile, date:dkey(new Date()) }, true); break;
    case 'export':   exportData(); break;
    case 'import':   importData(); break;
  }
});

/* Modal */
$('#sheet').addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-cat]');
  if(!t) return;

  if(t.dataset.cat){
    const c = catById(t.dataset.cat);
    if(c) openEntry(newDraft(c), true);
    return;
  }

  const b = Number(t.dataset.b), si = Number(t.dataset.s);

  switch(t.dataset.act){
    case 'close': closeSheet(); break;

    /* Eintrag */
    case 'saveentry': saveEntry(); break;
    case 'delentry':
      if(window.confirm('Diesen Eintrag löschen?')){
        S.entries = S.entries.filter(x => x.id !== draft.id);
        save(); closeSheet(); render(); toast('Gelöscht');
      }
      break;
    case 'addset':
      draft.blocks[b].sets.push({ reps:'', weight:'' });
      $('#blocks').innerHTML = renderBlocks(draft);
      break;
    case 'delset':
      draft.blocks[b].sets.splice(si,1);
      if(!draft.blocks[b].sets.length) draft.blocks[b].sets.push({ reps:'', weight:'' });
      $('#blocks').innerHTML = renderBlocks(draft);
      break;
    case 'delex':
      draft.blocks.splice(b,1);
      $('#blocks').innerHTML = renderBlocks(draft);
      break;
    case 'addex': {
      const n = window.prompt('Name der Übung');
      if(n && n.trim()){
        draft.blocks = draft.blocks || [];
        draft.blocks.push({ exercise:n.trim(), sets:[{reps:'',weight:''}] });
        $('#blocks').innerHTML = renderBlocks(draft);
      }
      break;
    }

    /* Körper */
    case 'savebody': saveBody(); break;
    case 'delbody':
      if(window.confirm('Diese Messung löschen?')){
        S.body = S.body.filter(x => x.id !== draft.id);
        save(); closeSheet(); render(); toast('Gelöscht');
      }
      break;

    /* Kategorien */
    case 'newcat':   openNewCat(); break;
    case 'savecat': {
      const name = $('#nc-name').value.trim();
      if(!name){ toast('Bitte einen Namen eingeben'); return; }
      const kind = $('#nc-kind').value;
      S.custom.push({ id:uid(), name, kind, exercises:[] });
      save(); openPicker(); toast('Kategorie angelegt');
      break;
    }
    case 'addcardio': {
      const n = window.prompt('Name der Cardio-Art');
      if(n && n.trim()){ S.cardio.push({ id:uid(), name:n.trim() }); save(); openManage(); }
      break;
    }
    case 'delcardio':
      S.cardio = S.cardio.filter(c => c.id !== t.dataset.id); save(); openManage(); break;
    case 'delcustom':
      S.custom = S.custom.filter(c => c.id !== t.dataset.id); save(); openManage(); break;
    case 'addplan': {
      const n = window.prompt('Name des Trainings (z. B. Beine)');
      if(n && n.trim()){ S.plans.push({ id:uid(), name:n.trim(), exercises:[] }); save(); openManage(); }
      break;
    }
    case 'renameplan': {
      const p = S.plans.find(x => x.id === t.dataset.id); if(!p) break;
      const n = window.prompt('Neuer Name', p.name);
      if(n && n.trim()){ p.name = n.trim(); save(); openManage(); }
      break;
    }
    case 'delplan':
      if(window.confirm('Training löschen? Bereits erfasste Einträge bleiben erhalten.')){
        S.plans = S.plans.filter(p => p.id !== t.dataset.id); save(); openManage();
      }
      break;
    case 'addplanex': {
      const p = S.plans.find(x => x.id === t.dataset.id); if(!p) break;
      const n = window.prompt('Name der Übung');
      if(n && n.trim()){ p.exercises.push(n.trim()); save(); openManage(); }
      break;
    }
    case 'delplanex': {
      const p = S.plans.find(x => x.id === t.dataset.id); if(!p) break;
      p.exercises.splice(Number(t.dataset.i),1); save(); openManage();
      break;
    }
  }
});

/* Eingaben im Modal direkt in den Entwurf schreiben */
$('#sheet').addEventListener('input', e => {
  const el = e.target;
  if(!draft) return;
  if(el.dataset.sf){
    draft.blocks[Number(el.dataset.b)].sets[Number(el.dataset.s)][el.dataset.sf] = el.value;
    return;
  }
  if(el.dataset.f){
    draft[el.dataset.f] = el.value;
    if(el.dataset.f === 'distance' || el.dataset.f === 'durText') updatePace();
  }
});

   Start

function render(){
  renderHead();
  $('#main').innerHTML =
    view === 'cal'  ? renderCal()  :
    view === 'body' ? renderBody() : renderDash();
}

render();
