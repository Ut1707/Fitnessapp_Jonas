/* ============================================================
   12b · TRAININGS AUS TEXT — PARSER
   Reine Funktionen: kein DOM, kein S, keine anderen Helfer.
   tests/txt-import.test.mjs schneidet genau diesen Block aus
   und prüft ihn mit Node. Kein Lookbehind verwenden — ältere
   iOS-Safaris brechen sonst beim Laden der ganzen App ab.
   ============================================================ */

/* Wortende auch vor Umlauten — \b hält „ä" für ein Nicht-Wortzeichen */
const TXT_NB   = '(?=[^0-9A-Za-zÄÖÜäöüß]|$)';
const TXT_ZEIT = 'sekunden|sek\\.?|sec|s|minuten|min\\.?';
const TXT_SATZ = 'sätze|satz|sets?|serien|runden|rounds|durchgänge';
const TXT_WDH  = 'wdh\\.?|wiederholungen|reps?';
const TXT_BIS  = '(?:\\s*(?:-|bis|/)\\s*(\\d{1,3}))?';
const TXT_RE = {
  bullet:  /^(?:[-*•·>–—]+|\d{1,2}[.)])\s+/,
  kopf:    /^(?:(?:tag|day|woche|week|training|einheit)\s*\d+|montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonntag)(?=[^0-9A-Za-zÄÖÜäöüß]|$)/i,
  warm:    /^(?:aufwärmen|aufwärmung|erwärmung|warm-?up)(?=[^0-9A-Za-zÄÖÜäöüß]|$)\s*:?\s*(.*)$/i,
  note:    /^(?:notiz|hinweis|note|info|tipp)\s*:\s*(.+)$/i,
  plan:    /^(?:mein\s+)?(?:trainings)?(?:plan|programm|split)(?=[\s:]|$)\s*:?\s*(.*)$/i,
  pause:   new RegExp('(?:^|\\s)(?:satzpause|pause|rest|ruhe)\\s*:?\\s*(\\d{1,3}(?:[.,]\\d)?)\\s*('+TXT_ZEIT+')?'+TXT_NB, 'i'),
  pause2:  new RegExp('(\\d{1,3}(?:[.,]\\d)?)\\s*('+TXT_ZEIT+')\\s*(?:satzpause|pause|rest)'+TXT_NB, 'i'),
  kg:      new RegExp('@?\\s*(\\d{1,3}(?:[.,]\\d{1,2})?)\\s*kg'+TXT_NB, 'i'),
  perLeg:  /(?:^|\s)(?:(?:pro|je|per)\s+(?:bein|leg)|each\s+leg|einbeinig)(?=[^0-9A-Za-zÄÖÜäöüß]|$)/i,
  perSide: /(?:^|\s)(?:(?:pro|je|per)\s+(?:seite|side|arm)|each\s+side|einarmig)(?=[^0-9A-Za-zÄÖÜäöüß]|$)/i,
  /* 4x8, 4 x 8-10, 3x45 Sek */
  sxr:     new RegExp('(\\d{1,2})\\s*x\\s*(\\d{1,3})'+TXT_BIS+'(?:\\s*('+TXT_WDH+'|'+TXT_ZEIT+'))?'+TXT_NB, 'i'),
  /* 3 Sätze à 10 Wdh, 3 sets of 12, 3 Runden à 45 Sek */
  satzWdh: new RegExp('(\\d{1,2})\\s*(?:'+TXT_SATZ+')'+TXT_NB+'\\s*(?:à|a|zu|je|mit|of|x|,|:)?\\s*(\\d{1,3})'+TXT_BIS+
                      '(?:\\s*('+TXT_WDH+'|'+TXT_ZEIT+'))?'+TXT_NB, 'i'),
  /* 12 Wdh x 3 Sätze */
  wdhSatz: new RegExp('(\\d{1,3})'+TXT_BIS+'\\s*(?:'+TXT_WDH+')'+TXT_NB+'\\s*(?:x|,|in|bei|à)?\\s*(\\d{1,2})\\s*(?:'+TXT_SATZ+')'+TXT_NB, 'i'),
  /* nur Wiederholungen bzw. nur Sekunden → 3 Sätze */
  nurWdh:  new RegExp('(\\d{1,3})'+TXT_BIS+'\\s*('+TXT_WDH+')'+TXT_NB, 'i'),
  nurZeit: new RegExp('(\\d{1,3})'+TXT_BIS+'\\s*(sekunden|sek\\.?|sec|s)'+TXT_NB, 'i'),
  /* Reste nach dem Herausschneiden */
  rest:    new RegExp('(?:^|\\s)(?:'+TXT_SATZ+'|'+TXT_WDH+'|x)'+TXT_NB, 'gi')
};

function txtUnique(name, taken){
  let n = name, i = 2;
  while(taken.indexOf(n) >= 0) n = name+' ('+(i++)+')';
  return n;
}

function txtSplitList(t){
  return String(t || '').split(/\s*[,;·]\s*|\s+\+\s+/).map(x => x.trim()).filter(Boolean);
}

function txtTitle(line){
  return line.replace(/^(?:training|workout|einheit)\s*:\s*/i, '')
             .replace(/\s*:\s*$/, '').replace(/\s*:\s*/g, ' · ')
             .replace(/\s+/g, ' ').trim().slice(0, 60);
}

/** "90" → "90 Sek.", "2" → "2 Min." (ohne Einheit gilt bis 5 als Minuten) */
function txtRest(v, u){
  const n = parseFloat(String(v).replace(',', '.'));
  const min = u ? /^m/i.test(u) : n <= 5;
  return min ? String(n).replace('.', ',')+' Min.' : Math.round(n)+' Sek.';
}

function txtName(s){
  return s.replace(TXT_RE.rest, ' ')
          .replace(/[(\[]\s*[)\]]/g, ' ')
          .replace(/\s+/g, ' ')
          .replace(/(?:\s+(?:à|a|bei|mit|zu|je|@))+\s*$/i, '')
          .replace(/^[\s:,;|@\-.]+|[\s:,;|@\-(]+$/g, '')
          .trim();
}

/** Steigerungsschritt und Gewichtsart aus dem Übungsnamen raten — nur Schlüssel aus PLAN.steps */
function guessExKind(name){
  const s = name.toLowerCase();
  if(/plank|unterarmstütz|crunch|sit-?up|burpee|hampelmann|jumping jack|mountain climber|superman|dead ?bug|bird ?dog|hollow/.test(s))
    return { noWeight:true };
  if(/kurzhantel|\bkh\b|dumbbell/.test(s)) return { step:'kh', unit:'kgSeite' };
  if(/klimmz|pull-?up|chin-?up|dips|liegestütz|push-?up/.test(s)) return { step:'iso', unit:'kgZusatz' };
  if(/beinpresse|leg ?press/.test(s)) return { step:'presse' };
  if(/kniebeuge|squat|kreuzheben|deadlift|hip ?thrust|bankdrücken|bench|langhantel|barbell/.test(s)) return { step:'grund' };
  if(/maschine|machine|kabel|cable|seilzug|latzug|lat ?pull|presse|butterfly|beinbeuger|beinstrecker|abduktion|adduktion/.test(s))
    return { step:'maschine' };
  return { step:'iso' };
}

/** Eine Zeile als Übung lesen. Ohne Satz/Wdh.-Angabe nur mit fallback (dann 3 × 8–12, geschätzt). */
function txtExercise(line, fallback){
  let s = ' '+line.replace(/[×*]/g, 'x').replace(/[–—]/g, '-')+' ';
  const cut = re => {
    const m = s.match(re);
    if(m) s = s.slice(0, m.index)+' '+s.slice(m.index + m[0].length);
    return m;
  };
  const ex = {};
  let m = cut(TXT_RE.pause) || cut(TXT_RE.pause2);
  if(m) ex.rest = txtRest(m[1], m[2]);
  if((m = cut(TXT_RE.kg))) ex.kg = parseFloat(m[1].replace(',', '.'));
  if(cut(TXT_RE.perLeg)) ex.perLeg = true;
  else if(cut(TXT_RE.perSide)) ex.perSide = true;

  let sets = null, lo = null, hi = null, einheit = '';
  if((m = cut(TXT_RE.sxr) || cut(TXT_RE.satzWdh))){
    sets = +m[1]; lo = +m[2]; hi = m[3] ? +m[3] : lo; einheit = m[4] || '';
  }else if((m = cut(TXT_RE.wdhSatz))){
    lo = +m[1]; hi = m[2] ? +m[2] : lo; sets = +m[3];
  }else if((m = cut(TXT_RE.nurWdh) || cut(TXT_RE.nurZeit))){
    sets = 3; lo = +m[1]; hi = m[2] ? +m[2] : lo; einheit = m[3] || '';
  }else if(fallback){
    sets = 3; lo = 8; hi = 12; ex.guessed = true;
  }else return null;
  if(!(sets >= 1) || !(lo >= 1)) return null;
  if(lo > hi){ const t = lo; lo = hi; hi = t; }
  if(/^m/i.test(einheit)){ lo *= 60; hi *= 60; ex.time = true; }
  else if(/^s/i.test(einheit)) ex.time = true;

  const n = txtName(s);
  if(n.length < 2) return null;
  ex.n = n.slice(0, 80);
  ex.sets = Math.min(10, sets);
  ex.reps = [lo, hi];
  if(!ex.rest) ex.rest = '90 Sek.';
  Object.assign(ex, guessExKind(n));
  if(ex.guessed && ex.noWeight && /plank|stütz|halten|hold|wall ?sit/i.test(n)){ ex.time = true; ex.reps = [30,45]; }
  if(ex.time) ex.noWeight = true;
  if(ex.noWeight){ delete ex.step; delete ex.unit; delete ex.kg; }
  return ex;
}

/**
 * Frei geschriebenen Text in Trainings zerlegen.
 * → { workouts:[{ name, plan, note, warmup, ex }], skipped:[Zeilen] }
 */
function parseTrainingText(text, opts){
  opts = opts || {};
  const res = { workouts:[], skipped:[] };
  let cur = null, plan = '', warmMode = false;
  let pend = { warmup:[], note:'' };   // Aufwärmen/Notiz vor der ersten Überschrift

  const neu = name => {
    cur = { name:name, plan:plan, note:pend.note, warmup:pend.warmup, ex:[] };
    pend = { warmup:[], note:'' };
    res.workouts.push(cur);
    warmMode = false;
  };
  /* Überschrift ohne Übungen wieder entfernen, Aufwärmen/Notiz weiterreichen */
  const dropEmpty = () => {
    if(!cur || cur.ex.length) return '';
    res.workouts.pop();
    pend = { warmup:cur.warmup.concat(pend.warmup), note:[cur.note, pend.note].filter(Boolean).join(' ') };
    const name = cur.name; cur = null;
    return name;
  };
  const addNote = t => {
    const z = cur || pend;
    z.note = z.note ? z.note+' '+t : t;
  };
  const addEx = ex => {
    if(!cur) neu(plan || opts.fallbackName || 'Importiertes Training');
    ex.n = txtUnique(ex.n, cur.ex.map(x => x.n));
    cur.ex.push(ex);
    warmMode = false;
  };

  String(text == null ? '' : text).replace(/^﻿/, '').split(/\r\n|\r|\n/).forEach(raw => {
    let line = raw.trim().replace(/^#+\s*/, '').replace(/\*\*|__/g, '').trim();
    if(!line){ warmMode = false; return; }
    const bullet = TXT_RE.bullet.test(line);
    if(bullet) line = line.replace(TXT_RE.bullet, '').trim();
    if(!line) return;
    let m;

    if((m = line.match(TXT_RE.warm))){
      const items = txtSplitList(m[1]);
      const z = cur || pend;
      z.warmup = z.warmup.concat(items);
      warmMode = !items.length;
      return;
    }
    if((m = line.match(TXT_RE.note))){ addNote(m[1].trim()); return; }

    const ex = txtExercise(line, false);
    if(ex){ addEx(ex); return; }

    if(bullet && !TXT_RE.kopf.test(line)){
      if(warmMode){ (cur || pend).warmup.push(line); return; }
      const d = txtExercise(line, true);
      if(d) addEx(d); else res.skipped.push(raw.trim());
      return;
    }
    warmMode = false;

    if(!bullet && (m = line.match(TXT_RE.plan))){
      const leer = dropEmpty();
      if(leer) res.skipped.push(leer);
      plan = txtTitle(m[1] || line);
      return;
    }
    if(line.length > 60 || /[.!?]$/.test(line)){
      if(cur) addNote(line); else res.skipped.push(raw.trim());
      return;
    }

    /* Überschrift eines neuen Trainings */
    const leer = dropEmpty();
    if(leer){
      if(!plan && !res.workouts.length) plan = leer;   // erste leere Überschrift = Name des Plans
      else res.skipped.push(leer);
    }
    neu(txtTitle(line));
  });

  const leer = dropEmpty();
  if(leer) res.skipped.push(leer);
  return res;
}

function readTxtFile(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.txt,.text,.md,text/plain,text/markdown';
  inp.onchange = () => {
    const f = inp.files[0]; if(!f) return;
    if(f.size > 200000){ toast('Datei zu groß — bitte eine einfache Textdatei'); return; }
    const lies = (enc, weiter) => {
      const r = new FileReader();
      r.onload = () => weiter(String(r.result || ''));
      r.onerror = () => toast('Datei konnte nicht gelesen werden');
      r.readAsText(f, enc);
    };
    /* Windows-Editor speichert Umlaute oft als ANSI — dann ein zweiter Versuch */
    lies('utf-8', t => t.indexOf('�') >= 0 ? lies('windows-1252', t2 => txtPreview(t2, f.name)) : txtPreview(t, f.name));
  };
  inp.click();
}

function txtPreview(text, quelle){
  text = String(text || '');
  if(!text.trim()){ toast('Kein Text — Datei wählen oder Text einfügen'); return; }
  const ausDatei = quelle ? quelle.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').trim() : '';
  imp = { text:text, quelle:quelle || '',
          result: parseTrainingText(text, { fallbackName: ausDatei || 'Importiertes Training' }) };
  renderTxtPreview();
}

function renderTxtPreview(){
  const r = imp.result, n = r.workouts.length;

    h += '<div class="empty">Keine Übungen erkannt. Eine Übung pro Zeile mit Sätzen und Wiederholungen, z. B. „Kniebeuge 4x8".</div>';

      '<div class="ctitle">'+esc(w.name)+'</div>'+
      '<div class="cmeta">'+w.ex.length+' Übung'+(w.ex.length===1?'':'en')+'</div>'+
      (w.warmup.length ? '<div class="small" style="margin-top:6px"><span class="muted">Aufwärmen:</span> '+esc(w.warmup.join(' · '))+'</div>' : '')+
      (w.note ? '<div class="cmeta" style="margin-top:6px">'+esc(w.note)+'</div>' : '')+
      '<table class="t" style="margin-top:10px"><tbody>'+
      w.ex.map((e,i) => '<tr><td>'+(i+1)+'. '+esc(e.n)+

          : (e.kg != null ? fmtNum(e.kg,1)+' ' : '')+esc(wLabelOf(e.unit)))+'</td></tr>').join('')+
      '</tbody></table></div>';

  if(r.skipped.length){

              (n === 1 ? 'Training übernehmen' : n+' Trainings übernehmen')+'</button>' : '')+

/** Parser-Ergebnis in ein Training im Format von PLAN.workouts / EXTRA übersetzen */
function toImported(pw, profileId, quelle, taken){
  const person = persOf(profileId);
  return {
    id: 'imp'+uid(), kind:'strength', imported:true,
    profile: profileId, for:[person],
    name: txtUnique(pw.name, taken),
    sub: 'Importiert'+(pw.plan ? ' · '+pw.plan : ''),
    plan: pw.plan || '', note: pw.note || '', warmup: pw.warmup || [],
    src: quelle || '', added: dkey(new Date()),
    ex: pw.ex.map(x => {
      const e = { n:x.n, sets:x.sets, reps:x.reps, rest:x.rest || '90 Sek.' };
      ['step','unit','perLeg','perSide','time','noWeight'].forEach(k => { if(x[k] != null) e[k] = x[k]; });
      if(x.kg != null && !x.noWeight){ e.start = {}; e.start[person] = [x.kg, x.kg]; }
      return e;
    })
  };
}

function saveTxtImport(){
  const r = imp && imp.result;
  if(!r || !r.workouts.length) return;
  const taken = myImported().map(w => w.name);
  const neu = r.workouts.map(pw => {
    const w = toImported(pw, S.profile, imp.quelle, taken);
    taken.push(w.name);
    return w;
  });
  S.imported = (S.imported || []).concat(neu);
  save(); closeSheet(); render();
  toast((neu.length === 1 ? '1 Training' : neu.length+' Trainings')+' ergänzt — unter „+ Eintragen" → Importiert');
}

function deleteImported(id){
  const w = (S.imported || []).find(x => x.id === id);
  if(!w) return;
  if(!window.confirm('„'+w.name+'" löschen? Bereits eingetragene Einheiten bleiben erhalten.')) return;
  S.imported = S.imported.filter(x => x.id !== id);
  const key = modKey(w.id, persOf(w.profile));
  delete S.exOff[key]; delete S.exAdd[key]; delete S.exOrder[key]; delete S.days[w.id];
  save(); render(); toast('Training gelöscht');
}

    try{ const d = JSON.parse(x.s); n = (d.entries||[]).length; g = (d.gewicht||[]).length; }catch(e){}
    return '<div class="item"><div class="txt"><div class="t1">'+esc(dShort(x.d))+(i===0?' · neueste':'')+'</div>'+
      '<div class="t2">'+n+' Trainings · '+g+' Gewichte</div></div>'+
      '<button class="btn btn-sm" data-act="restoreone" data-i="'+i+'">Zurückholen</button></div>';
  }).join('') : '<div class="empty">Noch keine automatische Sicherung vorhanden.</div>';

  let rescue = null;
  try{ rescue = localStorage.getItem(KEY_RESCUE); }catch(e){}
  if(rescue){
    h += '<div class="sec-title">Beschädigter Stand</div>'+
      '<div class="hint" style="margin-bottom:8px">Der Text, der sich nicht lesen ließ. '+
      'Schick ihn mir, dann versuche ich ihn zu retten.</div>'+
      '<textarea readonly style="min-height:110px;font-size:11px;font-family:ui-monospace,Menlo,monospace">'+
      esc(rescue)+'</textarea>'+
      '<button class="btn btn-block" data-act="rescuecopy" style="margin-top:8px">Text kopieren</button>';
  }

  h += '<div class="hint" style="margin-top:16px">Automatische Sicherungen liegen im selben Browserspeicher. '+
       'Gegen ein gelöschtes Gerät helfen nur eigene Sicherungen über „Daten sichern".</div>'+
       '<button class="btn btn-primary btn-block" data-act="close" style="margin-top:12px">Fertig</button>';
  openSheet(h);
}

function openImport(){
  openSheet(sheetHead('Sicherung einlesen', 'Ersetzt alle Daten auf diesem Gerät')+
    '<button class="btn btn-block" data-act="importfile">Datei auswählen</button>'+
    '<div class="field" style="margin-top:16px"><label for="im-t">oder Sicherungstext einfügen</label>'+
      '<textarea id="im-t" placeholder="{&quot;version&quot;:2, …}" style="min-height:120px;font-size:11px;font-family:ui-monospace,Menlo,monospace"></textarea></div>'+
    '<button class="btn btn-primary btn-block" data-act="importtext">Einlesen</button>');
}

/** Gemeinsamer Weg für Datei und Text */
function applyImport(text){
  let d;
  try{ d = JSON.parse(text); }catch(e){ toast('Das ist kein gültiger Sicherungstext'); return; }
  if(!d || !Array.isArray(d.entries)){ toast('Sicherung unvollständig — entries fehlt'); return; }
  const n = d.entries.length;
  if(!window.confirm('Sicherung mit '+n+' Trainings einlesen? Alle aktuellen Daten auf diesem Gerät werden ersetzt.')) return;
  S = Object.assign(defaults(), d);
  save(); closeSheet(); render();
  toast(n+' Trainings eingelesen');
}

function exportData(){
  const blob = new Blob([JSON.stringify(S,null,2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'training-sicherung-'+dkey(new Date())+'.json';
  a.click(); setTimeout(()=> URL.revokeObjectURL(a.href), 1000);
}
function importData(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = () => {
    const f = inp.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => applyImport(r.result);
    r.onerror = () => toast('Datei konnte nicht gelesen werden');
    r.readAsText(f);
  };
  inp.click();
}

/* ============================================================

$('#main').addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-day],[data-mon],[data-edit],[data-detail],[data-medit],[data-foto]');
  if(!t) return;

  if(t.dataset.detail){ openEntryDetail(t.dataset.detail); return; }

  if(t.dataset.mon){ calMonth.setMonth(calMonth.getMonth() + Number(t.dataset.mon)); render(); return; }
  if(t.dataset.day){ selDate = t.dataset.day; render(); return; }
  if(t.dataset.edit){
    const en = S.entries.find(x => x.id === t.dataset.edit);
    if(!en) return;
    if(en.kind === 'strength') openEditStrength(JSON.parse(JSON.stringify(en)));
    else openEntry(JSON.parse(JSON.stringify(en)), false);
    return;
  }
  if(t.dataset.medit){
    const m = S.masse.find(x => x.id === t.dataset.medit);
    if(m) openMass(JSON.parse(JSON.stringify(m)), false);
    return;
  }
  if(t.dataset.foto){
    const k = S.profile+'|'+t.dataset.foto;
    S.fotos[k] = !S.fotos[k]; save(); render();
    toast(S.fotos[k] ? 'Fotos als erledigt markiert' : 'Haken entfernt');
    return;
  }

  switch(t.dataset.act){
    case 'wocont': woFortsetzen(); break;
    case 'wodrop':
      if(window.confirm('Die eingetippten Sätze dieses Trainings endgültig verwerfen?')){
        woVerwerfen(); render(); toast('Verworfen');
      }
      break;
    case 'restore': openRestore(); break;
    case 'startwo': openWorkout(t.dataset.id, dkey(new Date()), t.dataset.short === '1'); break;
    case 'modus':
      S.modus = t.dataset.m; save(); render();
      toast(S.modus === '4' ? 'Vier Einheiten pro Woche' : 'Drei Einheiten pro Woche');
      break;
    case 'woedit': openWoEdit(t.dataset.id); break;
    case 'setstart': openStart(); break;
    case 'new': openPicker(); break;
    case 'manage': openManage(); break;
    case 'newmass': openMass({ id:uid(), profile:S.profile, date:dkey(new Date()) }, true); break;
    case 'savegw': {
      const v = num($('#gw').value);
      const heute = dkey(new Date());
      const i = S.gewicht.findIndex(x => x.profile === S.profile && x.date === heute);
      if(v == null){
        if(i >= 0){ S.gewicht.splice(i,1); save(); render(); toast('Gewicht gelöscht'); }
        else toast('Bitte eine Zahl eintragen');
        return;
      }
      if(i >= 0) S.gewicht[i].kg = v;
      else S.gewicht.push({ id:uid(), profile:S.profile, date:heute, kg:v });
      save(); render(); toast('Gewicht gespeichert');
      break;
    }
    case 'export': openExport(); break;
    case 'import': openImport(); break;
    case 'txtimport': openTxtImport('', ''); break;
    case 'impdel': deleteImported(t.dataset.id); break;
  }
});

$('#main').addEventListener('change', e => {
  if(e.target.dataset.chg === 'expick'){
    const n = e.target.value;
    e.target.value = '';
    if(n) openExHistory(n);
    return;
  }
  if(e.target.dataset.act === 'essen'){
    const k = S.profile+'|'+dkey(new Date());
    if(e.target.checked) S.essen[k] = true; else delete S.essen[k];
    save(); render();
  }
});

$('#sheet').addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-cat],[data-wp]');
  if(!t) return;

  if(t.dataset.wp){ wo.active = t.dataset.wp; renderWorkout(); return; }

  if(t.dataset.cat){
    const [typ, id] = t.dataset.cat.split(':');
    if(typ === 'plan'){ closeSheet(); openWorkout(id, selDate, false); return; }
    if(typ === 'c'){
      const c = S.cardio.find(x => x.id === id);
      openEntry({ id:uid(), profile:S.profile, date:selDate, kind:'cardio', cat:c.name, note:'' }, true);
      return;
    }
    const c = S.custom.find(x => x.id === id);
    openEntry({ id:uid(), profile:S.profile, date:selDate, kind:c.kind, cat:c.name, note:'' }, true);
    return;
  }

  const bi = Number(t.dataset.b), si = Number(t.dataset.s);
  const d = wo ? wo.drafts[wo.active] : null;

  switch(t.dataset.act){
    case 'close': if(wo) closeWorkoutSheet(); else closeSheet(); break;

    case 'addset': d.blocks[bi].sets.push({ reps:'', weight:d.blocks[bi].sets[0] ? d.blocks[bi].sets[0].weight : '' });
      $('#blocks').innerHTML = renderBlocks(); break;
    case 'delset': d.blocks[bi].sets.splice(si,1);
      if(!d.blocks[bi].sets.length) d.blocks[bi].sets.push({ reps:'', weight:'' });
      $('#blocks').innerHTML = renderBlocks(); break;
    case 'delex': d.blocks.splice(bi,1); $('#blocks').innerHTML = renderBlocks(); break;
    case 'allziel': {
      const z = d.blocks[bi].t && d.blocks[bi].t.reps;
      if(z) d.blocks[bi].sets.forEach(s => s.reps = String(z));
      $('#blocks').innerHTML = renderBlocks(); break;
    }
    case 'addex': openAddEx(); break;
    case 'backwo': renderWorkout(); break;
    case 'saveaddex': {
      const w = wo.w;
      const name = $('#ae-n').value.trim();
      if(!name){ toast('Bitte einen Namen eingeben'); return; }
      const sets = Math.max(1, Math.min(10, parseInt($('#ae-s').value,10) || 3));
      const rr = $('#ae-r').value.split(/[^0-9]+/).map(x => parseInt(x,10)).filter(x => !isNaN(x));
      const reps = rr.length >= 2 ? [Math.min(rr[0],rr[1]), Math.max(rr[0],rr[1])]
                 : rr.length ? [rr[0], rr[0]] : [8,12];
      const u = $('#ae-u').value;
      const ex = { n:name, sets:sets, reps:reps, rest:$('#ae-p').value.trim() || '90 Sek.', step:$('#ae-st').value };
      if(u === 'none') ex.noWeight = true; else if(u) ex.unit = u;
      if($('#ae-leg').checked) ex.perLeg = true;

      const ersetzt = $('#ae-rep').value;
      const dauerhaft = $('#ae-keep') ? $('#ae-keep').checked : false;
      const beide = $('#ae-both') ? $('#ae-both').checked : false;
      const ziele = beide ? Object.keys(wo.drafts) : [wo.active];

      if(dauerhaft){
        ziele.forEach(pid => {
          const key = modKey(w.id, persOf(pid));
          if(!allEx(w, persOf(pid)).some(x => x.n === name)) S.exAdd[key] = (S.exAdd[key] || []).concat([ex]);
          if(S.exOff[key]) S.exOff[key] = S.exOff[key].filter(x => x !== name);
          if(ersetzt) S.exOff[key] = (S.exOff[key] || []).concat([ersetzt]);
        });
        save();
      }

      /* Im offenen Formular sofort sichtbar machen, ohne eingetippte Werte zu verlieren */
      ziele.forEach(pid => {
        const dr = wo.drafts[pid]; if(!dr) return;
        if(dr.blocks.some(b => b.exercise === name)) return;
        const t = target(pid, w, ex, wo.date);
        dr.blocks.push({ exercise:name, unit:ex.unit, perLeg:ex.perLeg, perSide:ex.perSide,
          time:ex.time, noWeight:ex.noWeight, rest:ex.rest, reps:ex.reps, t:t,
          sets: Array.from({length:ex.sets}, () => ({
            reps:'', weight: t.weight != null && !ex.noWeight ? String(t.weight).replace('.',',') : '' })) });
        if(ersetzt) dr.blocks = dr.blocks.filter(b => b.exercise !== ersetzt);
      });

      renderWorkout();
      toast(dauerhaft
        ? (ersetzt ? '„'+ersetzt+'" ersetzt — gilt auch nächstes Mal' : 'Übung dauerhaft ergänzt')
        : 'Nur für heute hinzugefügt');
      break;
    }
    case 'savewo': saveWorkout(); break;
    case 'saveedit': {
      const blocks = d.blocks.map(b => ({ exercise:b.exercise, unit:b.unit, perLeg:b.perLeg, perSide:b.perSide,
        time:b.time, sets:(b.sets||[]).filter(s => String(s.reps).trim() !== '') })).filter(b => b.sets.length);
      if(!blocks.length){ toast('Mindestens einen Satz eintragen'); return; }
      const i = S.entries.findIndex(x => x.id === wo.editId);
      if(i >= 0){ S.entries[i].blocks = blocks; S.entries[i].note = d.note||''; }
      if(!save()) return;
      woVerwerfen(); closeSheet(); render(); toast('Gespeichert');
      break;
    }
    case 'delentry2':
      if(window.confirm('Diesen Eintrag löschen?')){
        S.entries = S.entries.filter(x => x.id !== wo.editId);
        save(); closeSheet(); render(); toast('Gelöscht');
      }
      break;

    case 'saveentry': saveEntry(); break;
    case 'delentry':
      if(window.confirm('Diesen Eintrag löschen?')){
        S.entries = S.entries.filter(x => x.id !== draft.id);
        save(); closeSheet(); render(); toast('Gelöscht');
      }
      break;

    case 'savemass': saveMass(); break;
    case 'delmass':
      if(window.confirm('Diese Messung löschen?')){
        S.masse = S.masse.filter(x => x.id !== draft.id);
        save(); closeSheet(); render(); toast('Gelöscht');
      }
      break;

    case 'savestart': {
      const v = $('#st').value;
      if(!v){ toast('Bitte ein Datum wählen'); return; }
      S.start = v; save(); closeSheet(); render(); toast('Startdatum gesetzt');
      break;
    }

    case 'newcat': openNewCat(); break;
    case 'savecat': {
      const name = $('#nc-name').value.trim();
      if(!name){ toast('Bitte einen Namen eingeben'); return; }
      S.custom.push({ id:uid(), name:name, kind:$('#nc-kind').value });
      save(); openPicker(); toast('Kategorie angelegt');
      break;
    }
    case 'addcardio': {
      const n = window.prompt('Name der Cardio-Art');
      if(n && n.trim()){ S.cardio.push({ id:uid(), name:n.trim() }); save(); openManage(); }
      break;
    }
    case 'delcardio': S.cardio = S.cardio.filter(c => c.id !== t.dataset.id); save(); openManage(); break;
    case 'delcustom': S.custom = S.custom.filter(c => c.id !== t.dataset.id); save(); openManage(); break;

    /* Vergangene Einheiten */
    case 'exhist': openExHistory(t.dataset.n); break;
    case 'editentry': {
      const en = S.entries.find(x => x.id === t.dataset.id);
      if(!en) break;
      if(en.kind === 'strength') openEditStrength(JSON.parse(JSON.stringify(en)));
      else openEntry(JSON.parse(JSON.stringify(en)), false);
      break;
    }
    case 'delentry3':
      if(window.confirm('Diesen Eintrag löschen?')){
        S.entries = S.entries.filter(x => x.id !== t.dataset.id);
        save(); closeSheet(); render(); toast('Gelöscht');
      }
      break;

    /* Trainings aus Textdatei */
    case 'txtimport': openTxtImport('', ''); break;
    case 'txtfile': readTxtFile(); break;
    case 'txtpreview': txtPreview($('#ti-t').value, imp ? imp.quelle : ''); break;
    case 'txtback': openTxtImport(imp.text, imp.quelle); break;
    case 'txtsave': saveTxtImport(); break;

    /* Sicherung */
    case 'restoreone': {
      const x = sicherungen()[Number(t.dataset.i)];
      if(!x) break;
      let d; try{ d = JSON.parse(x.s); }catch(e){ toast('Diese Sicherung ist unlesbar'); break; }
      if(!window.confirm('Sicherung vom '+dShort(x.d)+' mit '+(d.entries||[]).length+
         ' Trainings zurückholen? Der aktuelle Stand wird ersetzt.')) break;
      S = Object.assign(defaults(), d);
      gesperrt = false; ladefehler = null;
      if(save()){ closeSheet(); render(); toast('Sicherung vom '+dShort(x.d)+' zurückgeholt'); }
      break;
    }
    case 'rescuecopy': {
      const ta = $('#sheet textarea[readonly]');
      if(!ta) break;
      ta.select();
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(ta.value).then(()=>toast('Kopiert'), ()=>toast('Von Hand markieren'));
      }else{ try{ document.execCommand('copy'); toast('Kopiert'); }catch(e){ toast('Von Hand markieren'); } }
      break;
    }
    case 'exportfile': exportData(); break;
    case 'exportcopy': {
      const ta = $('#ex-t');
      ta.select(); ta.setSelectionRange(0, 999999);
      const fertig = () => toast('Sicherungstext kopiert');
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(ta.value).then(fertig, () => toast('Kopieren nicht erlaubt — Text von Hand markieren'));
      }else{
        try{ document.execCommand('copy'); fertig(); }
        catch(e){ toast('Kopieren nicht möglich — Text von Hand markieren'); }
      }
      break;
    }
    case 'importfile': importData(); break;
    case 'importtext': applyImport($('#im-t').value.trim()); break;

    /* Training anpassen */
    case 'newex': openNewEx(t.dataset.id); break;
    case 'savenewex': {
      const wid = t.dataset.id, key = modKey(wid, pers());
      const name = $('#ne-n').value.trim();
      if(!name){ toast('Bitte einen Namen eingeben'); return; }
      if(allEx(woById(wid), pers()).some(x => x.n === name)){ toast('Übung gibt es schon'); return; }
      const sets = Math.max(1, Math.min(10, parseInt($('#ne-s').value,10) || 3));
      const rr = $('#ne-r').value.split(/[-–bis ]+/).map(x => parseInt(x,10)).filter(x => !isNaN(x));
      const reps = rr.length >= 2 ? [Math.min(rr[0],rr[1]), Math.max(rr[0],rr[1])] : (rr.length ? [rr[0], rr[0]] : [8,12]);
      const u = $('#ne-u').value;
      const ex = { n:name, sets:sets, reps:reps, rest:'90 Sek.', step:$('#ne-st').value };
      if(u === 'none') ex.noWeight = true; else if(u) ex.unit = u;
      if($('#ne-leg').checked) ex.perLeg = true;
      S.exAdd[key] = (S.exAdd[key] || []).concat([ex]);
      if(S.exOff[key]) S.exOff[key] = S.exOff[key].filter(n => n !== name);
      save(); openWoEdit(wid); toast('Übung hinzugefügt');
      break;
    }
    case 'exoff': {
      const key = modKey(t.dataset.id, pers());
      S.exOff[key] = (S.exOff[key] || []).concat([t.dataset.n]);
      save(); openWoEdit(t.dataset.id);
      break;
    }
    case 'exon': {
      const key = modKey(t.dataset.id, pers());
      S.exOff[key] = (S.exOff[key] || []).filter(n => n !== t.dataset.n);
      save(); openWoEdit(t.dataset.id);
      break;
    }
    case 'exdel': {
      const key = modKey(t.dataset.id, pers());
      S.exAdd[key] = (S.exAdd[key] || []).filter(x => x.n !== t.dataset.n);
      S.exOff[key] = (S.exOff[key] || []).filter(n => n !== t.dataset.n);
      save(); openWoEdit(t.dataset.id);
      break;
    }
    case 'exmove':
      moveEx(t.dataset.id, t.dataset.n, Number(t.dataset.d));
      openWoEdit(t.dataset.id);
      break;
  }
});

$('#sheet').addEventListener('change', e => {
  const el = e.target;

  /* Training auf ein anderes Datum legen — auch nachträglich */
  if(el.dataset.chg === 'wodate' && wo){
    const neu = el.value;
    if(!neu){ el.value = wo.date; return; }
    const hatWerte = Object.keys(wo.drafts).some(pid =>
      wo.drafts[pid].blocks.some(b => (b.sets||[]).some(s => String(s.reps).trim() !== '')));
    wo.date = neu;
    if(hatWerte){
      Object.keys(wo.drafts).forEach(pid => { wo.drafts[pid].date = neu; });
    }else{
      /* Noch nichts eingetippt: Empfehlungen für das neue Datum neu rechnen */
      Object.keys(wo.drafts).forEach(pid => { wo.drafts[pid] = buildDraft(wo.w, pid, neu, wo.short); });
    }
    renderWorkout();
    return;
  }

  if(el.dataset.chg === 'setday'){
    const w = woById(el.dataset.id);
    const d = Number(el.value);
    if(d < 0 || d === w.day) delete S.days[w.id]; else S.days[w.id] = d;
    save(); render();
    toast(d < 0 ? w.name+' hat keinen festen Tag mehr' : w.name+' liegt jetzt am '+wdName(d));
  }
});

$('#sheet').addEventListener('input', e => {
  const el = e.target;
  if(el.dataset.sf && wo){
    wo.drafts[wo.active].blocks[Number(el.dataset.b)].sets[Number(el.dataset.s)][el.dataset.sf] = el.value;
    woSichern();
    return;
  }
  if(el.dataset.wf && wo){ wo.drafts[wo.active][el.dataset.wf] = el.value; woSichern(); return; }
  if(el.dataset.f && draft){
    draft[el.dataset.f] = el.value;
    if(el.dataset.f === 'distance' || el.dataset.f === 'durText') updatePace();
  }
});

    view === 'cal'  ? renderCal()  :
    view === 'body' ? renderBody() :
    view === 'plan' ? renderPlan() :
    view === 'essen'? renderEssen() : renderDash();
}
