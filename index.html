<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Training</title>
<style>
:root{
  --bg:#ffffff; --fg:#16181d; --muted:#71757e; --line:#e4e6ea; --soft:#f5f6f8;
  --accent:#2f6feb; --accent-soft:#eaf0fd; --good:#2c7a52; --danger:#c2413a;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#131417; --fg:#e9eaec; --muted:#8e939c; --line:#2a2c31; --soft:#1b1d21;
    --accent:#6fa0ff; --accent-soft:#1c2740; --good:#5fbf8c; --danger:#e0736b;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--fg);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:620px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}

header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.head-in{max-width:620px;margin:0 auto;padding:10px 16px}
.profiles{display:flex;gap:6px;background:var(--soft);padding:4px;border-radius:var(--radius)}
.profiles button{flex:1;padding:9px 8px;border:0;background:transparent;border-radius:7px;color:var(--muted);font-weight:500}
.profiles button[aria-pressed="true"]{background:var(--bg);color:var(--fg);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;
  background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;max-width:200px;border:0;background:none;padding:8px 0 9px;color:var(--muted);
  font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--fg);font-weight:600}

/* Katalog */
#kat-q{margin-bottom:10px;-webkit-appearance:none;appearance:none}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px;margin:0 -16px 4px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:16px;padding:6px 12px;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
.kat-da{opacity:.45}
button.itemb .chev{font-size:17px}

/* Heute */
.week{margin-top:20px}
.hero{border:1px solid var(--line);background:var(--soft);border-radius:14px;padding:18px;margin:14px 0 4px}
.hero-t{font-size:23px;font-weight:700;letter-spacing:-.015em;margin:2px 0 3px}
.btn-lg{padding:14px;font-size:17px;border-radius:12px;margin-top:16px}
details.det-plain{border-bottom:1px solid var(--line)}
details.det-plain summary{padding:13px 0;cursor:pointer;list-style:none;display:flex;font-weight:500}
details.det-plain summary::-webkit-details-marker{display:none}
details.det-plain summary::after{content:'+';margin-left:auto;color:var(--muted);font-size:18px;line-height:1}
details.det-plain[open] summary::after{content:'−'}
details.det-plain .item:last-child,details.det-plain .itemb:last-child{border-bottom:0}

h2{font-size:17px;font-weight:600;margin:26px 0 10px}
h2:first-child{margin-top:20px}
h3.sub{font-size:15px;font-weight:600;margin:18px 0 8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:9px 14px;border-radius:var(--radius)}
.btn:active{background:var(--soft)}
.btn-primary{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
.btn-ghost{border:0;background:none;color:var(--accent);padding:8px 0;text-align:left}
.btn-danger{color:var(--danger);border:0;background:none;padding:8px 0}
.btn-sm{padding:5px 10px;font-size:14px;border-radius:8px}
.btn-block{display:block;width:100%;text-align:center}

label{display:block;font-size:13px;color:var(--muted);margin:0 0 5px}
input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{
  width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
textarea{resize:vertical;min-height:60px}
.field{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.empty{color:var(--muted);font-size:14px;padding:18px 0;text-align:center}
.hint{font-size:12.5px;color:var(--muted);margin-top:5px}

/* Karten */
.card{border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.card.accent{border-color:var(--accent);background:var(--accent-soft)}
.card .ctitle{font-weight:600;margin-bottom:2px}
.card .cmeta{font-size:13px;color:var(--muted)}
.tagline{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px}
details.det{padding:0}
details.det summary{padding:14px;cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:2px}
details.det summary::-webkit-details-marker{display:none}
details.det summary::after{content:'+';margin-left:auto;color:var(--muted);font-size:18px;line-height:1}
details.det[open] summary::after{content:'−'}
details.det > *:not(summary){margin-left:14px;margin-right:14px}
details.det > *:last-child{margin-bottom:14px}

.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--fg)}
.bar.g i{background:var(--good)}

.worow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.worow .wotxt{min-width:0}
.worow .won{font-weight:600;font-size:15px}
.worow .wom{font-size:12.5px;color:var(--muted);margin-top:1px}
.worow.fertig .won{font-weight:500;color:var(--muted)}

.item{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .txt{min-width:0}
.item .t1{font-weight:600}
.item .t2{font-size:13.5px;color:var(--muted);margin-top:2px}
.chev{border:0;background:none;color:var(--muted);padding:4px 0 4px 8px;flex:none;font-size:14px}
.chev:disabled{opacity:.3}
button.chev[data-act]{min-width:36px;min-height:36px;padding:0 6px;font-size:16px}
button.itemb{width:100%;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font:inherit;color:inherit}
button.itemb:active{background:var(--soft)}
button.itemb .txt{display:block}
button.itemb .t1,button.itemb .t2{display:block}
button.itemb .chev{align-self:center}

/* Zahlen */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.stat{background:var(--bg);padding:14px}
.stat .v{font-size:22px;font-weight:600;letter-spacing:-.01em}
.stat .k{font-size:12.5px;color:var(--muted);margin-top:2px}
.chart{width:100%;height:100px;display:block;margin-top:6px}
.stat .v .v2{font-size:15px;color:var(--muted);font-weight:500}
.wbars{position:relative;display:flex;align-items:flex-end;gap:6px;height:120px;margin:18px 0 4px;padding-bottom:20px}
.wbar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;position:relative}
.wsaule{background:var(--accent-soft);border-radius:6px 6px 2px 2px;min-height:2px;position:relative}
.wbar.voll .wsaule{background:var(--accent)}
.wbar.jetzt .wsaule{outline:2px solid var(--accent);outline-offset:-2px}
.wsaule span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted)}
.wlab{position:absolute;bottom:-20px;left:-4px;right:-4px;text-align:center;font-size:11px;color:var(--muted)}
.wziel{position:absolute;left:0;right:0;border-top:1.5px dashed var(--muted);opacity:.6;pointer-events:none}
.wziel span{position:absolute;right:0;top:-17px;font-size:11px;color:var(--muted)}
.mg{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:14px}
.mg-n{width:78px;flex:none}
.mg-bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.mg-bar span{display:block;height:100%;background:var(--accent);border-radius:4px}
.mg-v{width:28px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.tipp{margin-top:14px;padding:12px 14px;background:var(--accent-soft);border-radius:var(--radius);font-size:14px;line-height:1.45}
/* HIIT */
.hstufe{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);text-align:center}
.hstufe .btn{min-width:44px;min-height:44px;font-size:20px}
.hs-v{font-size:18px;font-weight:600}.hs-k{font-size:13px;color:var(--muted);margin-top:2px}
.hliste{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.hl{display:flex;gap:12px;padding:9px 14px;border-top:1px solid var(--line);font-size:15px}
.hl:first-child{border-top:0}.hl span{width:44px;flex:none;color:var(--muted);font-variant-numeric:tabular-nums}
.hiit{position:fixed;inset:0;z-index:80;display:none;flex-direction:column;background:var(--bg);
  padding:calc(14px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom))}
.hiit.open{display:flex}
.hiit.h-arbeit{background:var(--accent);color:#fff}
.hiit.h-arbeit .btn{background:rgba(255,255,255,.18);color:#fff;border-color:transparent}
.hiit.h-arbeit .btn-primary{background:#fff;color:var(--accent)}
.hiit.h-arbeit .h-bar{background:rgba(255,255,255,.25)}.hiit.h-arbeit .h-bar span{background:#fff}
.h-top{display:flex;justify-content:space-between;font-size:14px;opacity:.85;font-variant-numeric:tabular-nums}
.h-bar{height:6px;border-radius:3px;background:var(--line);margin-top:10px;overflow:hidden}
.h-bar span{display:block;height:100%;background:var(--accent)}
.h-mitte{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px}
.h-label{font-size:20px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;opacity:.9}
.h-zahl{font-size:min(38vw,190px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.h-name{font-size:24px;font-weight:600;margin-top:8px}
.h-tipp{font-size:15px;opacity:.8;max-width:340px;line-height:1.4;margin-top:4px}
.h-knoepfe{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px;align-items:stretch}
.h-knoepfe .btn{min-height:56px}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--accent)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:0 0 6px}
table.t td{padding:7px 0;border-top:1px solid var(--line);vertical-align:top}
table.t td.r{text-align:right;white-space:nowrap}
.up{color:var(--good)} .dn{color:var(--danger)}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;
  padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
@media (min-width:640px){ .overlay{align-items:center} .sheet{border-radius:14px;max-height:88vh} }
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.sheet-head h3{margin:0;font-size:17px;font-weight:600}
.sheet-head .s2{font-size:13px;color:var(--muted);margin-top:2px}
.x{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:0 4px;flex:none}
.pick{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);padding:12px 14px;border-radius:var(--radius);margin-bottom:8px}
.pick:active{background:var(--soft)}
.pick .p2{font-size:13px;color:var(--muted);margin-top:2px}
.sec-title{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:20px 0 8px}
.sec-title:first-child{margin-top:0}

/* Trainingsformular */
.persw{display:flex;gap:6px;background:var(--soft);padding:4px;border-radius:var(--radius);margin-bottom:14px}
.persw button{flex:1;padding:8px;border:0;background:transparent;border-radius:7px;color:var(--muted);font-size:14px}
.persw button[aria-pressed="true"]{background:var(--bg);color:var(--fg);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.exblock{border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px}
.exblock .exhead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:2px}
.exblock .name{font-weight:600}
.exblock .rest{font-size:12px;color:var(--muted);white-space:nowrap;padding-top:2px}
.ziel{font-size:14px;font-weight:600;color:var(--accent);margin:4px 0 2px}
.letzt{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.warn{font-size:12.5px;color:var(--danger);margin-bottom:8px}
.setrow{display:grid;grid-template-columns:22px 1fr 1fr 30px;gap:8px;align-items:center;margin-bottom:6px}
.setrow.nw{grid-template-columns:22px 1fr 30px}
.setrow .n{font-size:13px;color:var(--muted);text-align:center}
.setrow input{padding:8px 10px;text-align:center}
.setrow .del{border:0;background:none;color:var(--muted);font-size:18px;line-height:1}
.setlabels{display:grid;grid-template-columns:22px 1fr 1fr 30px;gap:8px;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.setlabels.nw{grid-template-columns:22px 1fr 30px}
.setlabels span{text-align:center}
.exfoot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
.warmup{background:var(--soft);border-radius:var(--radius);padding:12px;margin-bottom:14px;font-size:14px}
.warmup summary{cursor:pointer;list-style:none}
.warmup summary::-webkit-details-marker{display:none}
.warmup ul{margin:6px 0 0;padding-left:18px}
.warmup li{margin:2px 0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));z-index:99;background:var(--fg);color:var(--bg);
  padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .18s;max-width:90%;text-align:center}
.toast.show{opacity:1}
.chk{display:flex;align-items:center;gap:10px;padding:10px 0}
.chk input{width:20px;height:20px;flex:none;margin:0}
.chk label{margin:0;font-size:15px;color:var(--fg)}
.inline-w{display:flex;gap:8px;align-items:flex-end}
.inline-w .field{flex:1;margin:0}
</style>
</head>
<body>

<header>
  <div class="head-in">
    <div class="profiles" id="profiles"></div>
  </div>
</header>
<nav class="tabbar" id="nav">
  <button data-v="heute" aria-current="page"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Heute</button>
  <button data-v="fortschritt"><svg viewBox="0 0 24 24"><path d="M4 19h16M7 15v-3M12 15V8M17 15V5"/></svg>Fortschritt</button>
  <button data-v="mehr"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Mehr</button>
</nav>

<main class="wrap" id="main"></main>
<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="hiit" id="hiit"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ============================================================
   1 · DER PLAN
   Feste Vorgabe. Wird nicht in der App bearbeitet.
   ============================================================ */

const PROFILES = [
  { id:'franca', name:'Franca', p:'sie' },
  { id:'jonas',  name:'Jonas',  p:'er'  }
];

const PLAN = {
  /* Steigerungsschritte je Übungstyp, in kg */
  steps: {
    grund:    { sie:5,   er:5,   label:'Kniebeuge, Kreuzheben, Hip Thrust' },
    presse:   { sie:10,  er:10,  label:'Beinpresse' },
    maschine: { sie:2.5, er:5,   label:'Maschinen (Beinbeuger, Latzug, Abduktion)' },
    kh:       { sie:2,   er:2,   label:'Kurzhanteln, pro Seite' },
    iso:      { sie:2.5, er:2.5, label:'Isolationsübungen' }
  },

  workouts: [

    /* ---- Beintag 1 · in beiden Varianten ---- */
    {
      id:'ukB', kind:'strength', modus:['3','4'], ord:1,
      name:'Unterkörper B', short:'Kniebeuge-Tag', sub:'Kniebeuge-Tag · Oberschenkel-dominant',
      for:['sie','er'],
      note:'Für beide identisch, nur die Gewichte unterscheiden sich. Schwerster Tag der Woche — mindestens ein Tag Abstand zum Hip-Thrust-Tag.',
      warmup:['5 Min. Rad','10× Bodyweight Squat','10× Ausfallschritt je Bein','15× Miniband-Abduktion','2–3 Kniebeuge-Aufwärmsätze mit leerer Stange'],
      ex:[
        { n:'Kniebeuge Langhantel', sets:4, reps:[6,10], rest:'2–3 Min.', step:'grund',
          start:{ sie:[25,35], er:[60,75] } },
        { n:'Beinpresse (Füße hoch)', sets:3, reps:[10,12], rest:'2 Min.', step:'presse',
          start:{ sie:[50,70], er:[120,150] } },
        { n:'Ausfallschritte gehend', sets:3, reps:[10,10], rest:'90 Sek.', step:'kh',
          unit:'kgSeite', perLeg:true, start:{ sie:[6,6], er:[14,14] } },
        { n:'Hyperextension glute-fokussiert', sets:3, reps:[12,15], rest:'90 Sek.', step:'iso',
          unit:'kgZusatz', start:{ sie:[0,0], er:[10,10] } },
        { n:'Klimmzüge oder Latzug', sets:3, reps:[8,12], rest:'2 Min.', step:'maschine',
          unit:'kgZusatz', modus:['3'], tag:'Zug-Block' },
        { n:'Rudern Langhantel', sets:3, reps:[8,12], rest:'90 Sek.', step:'grund',
          modus:['3'], tag:'Zug-Block' },
        { n:'Abduktion Maschine', sets:3, reps:[15,20], rest:'60 Sek.', step:'maschine',
          start:{ sie:[30,40], er:[45,55] }, tag:'ersetzt den Beinstrecker' },
        { n:'Wadenheben', sets:3, reps:[12,15], rest:'60 Sek.', step:'maschine',
          start:{ sie:[30,40], er:[60,80] } }
      ]
    },

    /* ---- Oberkörper 1 · nur im Vierer ---- */
    {
      id:'ok1', kind:'strength', modus:['4'], ord:2,
      name:'Oberkörper 1', short:'Grundübungen', sub:'Zug und Druck · Grundübungen',
      for:['sie','er'],
      note:'Zug und Druck bewusst gemischt, damit Rücken, Brust und Schultern zweimal pro Woche drankommen. Bizeps und Trizeps am Ende im Wechsel.',
      warmup:['5 Min. Rudergerät','15× Bandzug Außenrotation','10× Scapula Pull'],
      ex:[
        { n:'Klimmzüge oder Latzug', sets:3, reps:[8,12], rest:'2 Min.', step:'maschine',
          unit:'kgZusatz', start:{ sie:[25,30] } },
        { n:'Bankdrücken', sets:3, reps:[6,10], rest:'2 Min.', step:'grund' },
        { n:'Rudern Langhantel', sets:3, reps:[8,12], rest:'90 Sek.', step:'grund' },
        { n:'Schulterdrücken Kurzhantel', sets:3, reps:[8,12], rest:'90 Sek.', step:'kh',
          unit:'kgSeite', start:{ sie:[6,8] } },
        { n:'Bizepscurl Kurzhantel', sets:2, reps:[10,12], rest:'60 Sek.', step:'kh',
          unit:'kgSeite', start:{ sie:[6,8] }, tag:'im Wechsel mit Trizeps' },
        { n:'Trizepsdrücken Kabel', sets:2, reps:[12,15], rest:'60 Sek.', step:'maschine',
          start:{ sie:[10,15] }, tag:'im Wechsel mit Bizeps' }
      ]
    },

    /* ---- Beintag 2 · in beiden Varianten ---- */
    {
      id:'ukA', kind:'strength', modus:['3','4'], ord:3,
      name:'Unterkörper A', short:'Hip-Thrust-Tag', sub:'Hip-Thrust-Tag · Po-dominant',

/* Wenn der gespeicherte Stand unlesbar ist, darf die App auf keinen Fall
   mit leeren Daten weiterlaufen — der nächste Speichervorgang würde den
   kaputten, aber vielleicht rettbaren Stand endgültig überschreiben.
   Muss vor load() stehen, weil load() direkt darunter aufgerufen wird. */
let ladefehler = null;   // null | 'sicherung' | 'unlesbar'
let gesperrt = false;    // true = speichern blockiert

let S = load();
let view = 'heute';
let selDate = dkey(new Date());
let draft = null;   // einfaches Formular
let wo = null;      // Trainingsformular
let imp = null;     // Text-Import: { text, quelle, result }

function load(){
  const raw = localStorage.getItem(KEY);
  if(raw){
    try{
      return Object.assign(defaults(), JSON.parse(raw));
    }catch(e){
      try{ localStorage.setItem(KEY_RESCUE, raw); }catch(_){}
      const bak = neuesteSicherung();
      if(bak){
        ladefehler = 'sicherung';
        return Object.assign(defaults(), bak.daten);
      }
      ladefehler = 'unlesbar';
      gesperrt = true;
      return defaults();
    }
  }
  try{
    const alt = localStorage.getItem('ff_v1');
    if(alt) return migrate(JSON.parse(alt));
  }catch(e){}
  return defaults();
}

/* ---- Automatische Sicherungen: eine pro Tag, die letzten fünf ---- */

function sicherungen(){
  try{ return JSON.parse(localStorage.getItem(KEY_BAK) || '[]'); }
  catch(e){ return []; }
}
function neuesteSicherung(){
  const l = sicherungen();
  for(let i=0;i<l.length;i++){
    try{ return { datum:l[i].d, daten:JSON.parse(l[i].s) }; }catch(e){}
  }
  return null;
}
function sicherungAnlegen(txt){
  try{
    const heute = dkey(new Date());
    const l = sicherungen();
    if(l.length && l[0].d === heute) l.shift();      // heutige ersetzen
    l.unshift({ d:heute, s:txt });
    while(l.length){
      try{ localStorage.setItem(KEY_BAK, JSON.stringify(l.slice(0,5))); return; }
      catch(e){ l.pop(); }                            // bei Platzmangel älteste opfern
    }
  }catch(e){}
}
function migrate(old){
  const s = defaults();
  s.profile = old.profile || s.profile;
  s.cardio  = old.cardio || s.cardio;
  s.custom  = old.custom || s.custom;
  s.entries = old.entries || [];
  (old.body||[]).forEach(b => {
    if(b.weight) s.gewicht.push({ id:uid(), profile:b.profile, date:b.date, kg:b.weight });
    const m = { id:uid(), profile:b.profile, date:b.date };
    let any = false;
    if(b.hips){ m.po = b.hips; any = true; }
    if(b.thigh){ m.oberL = b.thigh; any = true; }
    if(b.waist){ m.taille = b.waist; any = true; }
    if(b.chest){ m.brust = b.chest; any = true; }
    if(b.arm){ m.arm = b.arm; any = true; }
    if(any) s.masse.push(m);
  });
  return s;
}
function save(){
  if(gesperrt){
    toast('Speichern blockiert — bitte unter Mehr → Automatische Sicherungen wiederherstellen');
    return false;
  }
  let txt;
  try{ txt = JSON.stringify(S); }
  catch(e){ toast('Daten konnten nicht geschrieben werden'); return false; }

  try{
    localStorage.setItem(KEY, txt);
    /* Rückprobe: ein stiller Fehlschlag ist der gefährlichste Fall */
    if(localStorage.getItem(KEY) !== txt) throw new Error('Rückprobe');
  }catch(e){
    gesperrt = true;
    window.alert('Speichern fehlgeschlagen!\n\nDeine Eingaben sind noch auf dem Bildschirm, aber nicht gesichert. '+
                 'Geh unter Mehr auf „Daten sichern" und kopier den Text, bevor du die App schließt.');
    return false;
  }
  sicherungAnlegen(txt);
  return true;
}

const $ = s => document.querySelector(s);
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function pad(n){ return String(n).padStart(2,'0'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function dkey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fromKey(k){ const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(k, n){ const d = fromKey(k); d.setDate(d.getDate()+n); return dkey(d); }
function daysBetween(a, b){ return Math.round((fromKey(b) - fromKey(a)) / 86400000); }
function dLabel(k){ return fromKey(k).toLocaleDateString('de-DE',{ weekday:'long', day:'numeric', month:'long', year:'numeric' }); }
function dShort(k){ return fromKey(k).toLocaleDateString('de-DE',{ day:'2-digit', month:'2-digit', year:'2-digit' }); }
function wdName(n){ return ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'][n]; }

function num(v){ const n = parseFloat(String(v==null?'':v).replace(',','.')); return isFinite(n) ? n : null; }
function fmtNum(n, dec){ return n==null ? '–' : n.toLocaleString('de-DE',{ minimumFractionDigits:dec||0, maximumFractionDigits:dec||0 }); }
function round25(x){ return Math.round(x/2.5)*2.5; }

function parseDur(str){
  if(!str) return null;
  const parts = String(str).trim().split(':');
  if(parts.some(p => p !== '' && isNaN(Number(p.replace(',','.'))))) return null;
  const n = parts.map(p => p === '' ? 0 : Math.abs(Number(p.replace(',','.'))));
  if(n.length === 1) return Math.round(n[0]*60);
  if(n.length === 2) return Math.round(n[0]*60 + n[1]);
  if(n.length === 3) return Math.round(n[0]*3600 + n[1]*60 + n[2]);
  return null;
}
function fmtDur(sec){
  if(sec==null) return '–';
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = Math.round(sec%60);
  return h ? h+':'+pad(m)+':'+pad(s) : m+':'+pad(s);
}
function pace(sec, km){ if(!sec || !km) return null; const p = sec/km; return Math.floor(p/60)+':'+pad(Math.round(p%60)); }

function toast(msg){

function dayOf(w){ return S.days[w.id] != null ? S.days[w.id] : w.day; }

/** Alle Übungen eines Trainings für eine Person, inklusive eigener */
function allEx(w, person){
  return (w.ex || [])
    .filter(x => (!x.for || x.for.includes(person)) && (!x.modus || x.modus.indexOf(S.modus) >= 0))
    .concat(S.exAdd[modKey(w.id, person)] || []);
}
/** Nur die aktiven, in der eingestellten Reihenfolge */
function exFor(w, person){
  const key = modKey(w.id, person);
  const off = S.exOff[key] || [];
  const list = allEx(w, person).filter(x => off.indexOf(x.n) < 0);
  const ord = S.exOrder[key];
  if(ord && ord.length){
    list.sort((a,b) => {
      const ia = ord.indexOf(a.n), ib = ord.indexOf(b.n);
      return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib);
    });
  }
  return list;
}
function woById(id){ return id === 'free' ? FREE : allWorkouts().find(w => w.id === id); }
function planToday(dateKey, person){
  const dow = fromKey(dateKey).getDay();
  return allWorkouts().filter(w => dayOf(w) === dow && w.for.includes(person));
}

function volume(e){
  if(e.kind !== 'strength') return 0;
  let v = 0;
  (e.blocks||[]).forEach(b => (b.sets||[]).forEach(s => {
    const r = num(s.reps), kg = num(s.weight);
    if(r && kg) v += r * kg * (b.perLeg ? 2 : 1) * (b.unit === 'kgSeite' ? 2 : 1);
  }));
  return v;
}
function setCount(e){ let n = 0; (e.blocks||[]).forEach(b => n += (b.sets||[]).filter(s => num(s.reps)).length); return n; }

function entrySub(e){
  if(e.kind === 'cardio'){
    const bits = [];
    if(e.distance) bits.push(fmtNum(e.distance,1)+' km');
    if(e.duration) bits.push(fmtDur(e.duration));
    const p = pace(e.duration, e.distance); if(p) bits.push(p+' /km');
    return bits.join(' · ') || 'Cardio';
  }
  if(e.kind === 'strength'){
    const ex = (e.blocks||[]).filter(b => (b.sets||[]).some(s => num(s.reps))).length;
    const v = volume(e);
    const n = setCount(e);
    const bits = [ex+' Übung'+(ex===1?'':'en'), n+(n===1?' Satz':' Sätze')];
    if(v) bits.push(fmtNum(v,0)+' kg');
    return bits.join(' · ');
  }
  const bits = []; if(e.duration) bits.push(fmtDur(e.duration)); if(e.note) bits.push(e.note);
  return bits.join(' · ') || 'Eintrag';
}

function lastSessions(profileId, planId, exName, limit){
  return S.entries
    .filter(e => e.profile === profileId && (planId == null || e.planId === planId))
    .map(e => ({ date:e.date, planId:e.planId, cat:e.cat, b:(e.blocks||[]).find(b => b.exercise === exName) }))
    .filter(x => x.b && (x.b.sets||[]).some(s => num(s.reps)))
    .sort((a,b) => a.date < b.date ? 1 : -1)
    .slice(0, limit || 3);
}

/** Arbeitsgewicht einer Einheit: das am häufigsten benutzte, bei Gleichstand das schwerere */
function workWeight(sets){
  const ws = (sets||[]).filter(s => num(s.reps)).map(s => num(s.weight)).filter(v => v != null);
  if(!ws.length) return null;
  const cnt = {};
  ws.forEach(v => cnt[v] = (cnt[v]||0) + 1);
  let best = null, bn = 0;
  Object.keys(cnt).forEach(k => {
    const v = Number(k);
    if(cnt[k] > bn || (cnt[k] === bn && v > best)){ best = v; bn = cnt[k]; }
  });
  return best;
}

function wLabelOf(unit){
  return unit === 'kgSeite' ? 'kg je Hantel' : unit === 'kgZusatz' ? 'kg Zusatz' : 'kg';
}

/** "60,0 kg · 6 / 6 / 6" bei gleichem Gewicht, sonst "6×60,0 · 8×65,0" */
function setsTxt(sets, unit){
  const list = (sets||[]).filter(s => num(s.reps));
  if(!list.length) return '';
  const ws = list.map(s => num(s.weight));
  const einheit = unit === 'kgSeite' ? 'kg je Hantel' : unit === 'kgZusatz' ? 'kg Zusatz' : 'kg';
  if(ws.every(v => v == null)) return list.map(s => num(s.reps)).join(' / ')+' Wdh.';
  if(ws.every(v => v != null && v === ws[0]))
    return fmtNum(ws[0],1)+' '+einheit+' · '+list.map(s => num(s.reps)).join(' / ');
  return list.map(s => num(s.reps)+'×'+(num(s.weight) != null ? fmtNum(num(s.weight),1) : '–')).join(' · ')+' '+einheit;
}

/** Ergebnis: { weight, reps, quelle, verlauf:[{date,txt}], fremd, warnung } */
function target(profileId, w, ex, dateKey){
  const person = persOf(profileId);
  const [lo, hi] = ex.reps;

  /* Verlauf: zuerst dieselbe Übung im selben Training, sonst dieselbe Übung woanders */
  let hist = lastSessions(profileId, w.id, ex.n, 3).filter(x => x.date < dateKey);
  let fremd = false;
  if(!hist.length){
    const any = lastSessions(profileId, null, ex.n, 3).filter(x => x.date < dateKey);
    if(any.length){ hist = any; fremd = true; }
  }
  const verlauf = hist.map(x => ({
    date: x.date,
    txt: setsTxt(x.b.sets, ex.unit || x.b.unit),
    wo: fremd ? (x.cat || '') : ''
  }));

  const startRange = ex.start && ex.start[person];
  const startTxt = startRange
    ? (startRange[0] === startRange[1] ? fmtNum(startRange[0],1) : fmtNum(startRange[0],1)+'–'+fmtNum(startRange[1],1))
    : null;

  if(!hist.length){
    return {
      weight: startRange ? startRange[0] : null,
      reps: lo,
      quelle: startTxt ? 'Erste Einheit dieser Übung · Startbereich '+startTxt+' kg' : 'Erste Einheit dieser Übung',
      naechst: (!ex.noWeight && ex.step)
        ? 'Ab dann: '+hi+' Wdh. in allen Sätzen → +'+fmtNum(PLAN.steps[ex.step][person],1)+' kg'
        : null,
      verlauf: [], fremd: false, warnung: null
    };
  }

  const last = hist[0];
  const sets = (last.b.sets||[]).filter(s => num(s.reps));
  const lastW = workWeight(sets);
  const minReps = Math.min.apply(null, sets.map(s => num(s.reps)));

  const step = ex.step ? PLAN.steps[ex.step][person] : 0;
  let nw = lastW, nr;

  if(minReps >= hi){
    nw = (lastW != null && step) ? lastW + step : lastW;
    nr = lo;
  }else{
    nr = minReps + 1;
  }

  /* Stagnation: zwei Einheiten in Folge gleiches Gewicht ohne zusätzliche Wdh. */
  let warnung = null;
  if(hist.length >= 3){
    const r = hist.map(h => {
      const ss = (h.b.sets||[]).filter(s => num(s.reps));
      return { w:workWeight(ss), min:Math.min.apply(null, ss.map(s => num(s.reps))) };
    });
    if(r[0].w === r[1].w && r[1].w === r[2].w && r[0].min <= r[1].min && r[1].min <= r[2].min){
      warnung = 'Zwei Einheiten ohne zusätzliche Wiederholung bei gleichem Gewicht. Plan-Regel: um 10 % senken auf '+
                (r[0].w != null ? fmtNum(round25(r[0].w*0.9),1)+' kg' : '−10 %')+' und mit mehr Reserve wieder aufbauen.';
    }
  }

  /* Nächster Gewichtssprung: sichtbar machen, worauf man hinarbeitet */
  let naechst = null;
  if(!ex.noWeight && step && nw != null){
    naechst = minReps >= hi
      ? 'Danach '+fmtNum(nw + step,1)+' '+wLabelOf(ex.unit)+', sobald wieder '+hi+
        (hi === lo ? '' : ' Wdh.')+' in allen Sätzen stehen'
      : 'Nächster Gewichtssprung auf '+fmtNum(nw + step,1)+' '+wLabelOf(ex.unit)+
        ', sobald '+hi+' Wdh. in allen Sätzen stehen';
  }

  return {
    weight: nw,
    reps: nr,
    quelle: minReps >= hi
      ? 'Oberes Ende des Bereichs stand in allen Sätzen → Gewicht +'+fmtNum(step,1)+' kg, Wdh. zurück auf '+lo
      : 'Beim letzten Mal standen alle Sätze mit '+minReps+' → eine Wiederholung mehr',
    naechst: naechst, verlauf: verlauf, fremd: fremd, warnung: warnung
  };
}

/** Die laufende Woche, Montag bis Sonntag */
function laufendeWoche(k){
  const von = addDays(k, -((fromKey(k).getDay()+6)%7));
  return { von:von, bis:addDays(von, 6) };
}

/** Grobe Dauer einer Einheit: Satzzeit plus Pausen plus Aufwärmen und Wege */
function dauerVon(w, person){
  let sec = (w.warmup && w.warmup.length ? 8*60 : 0) + 8*60;
  exFor(w, person).forEach(e => {
    const p = String(e.rest || '90 Sek.');
    const zahl = parseFloat(p.replace(',','.')) || 1.5;
    const pause = /Min/.test(p) ? zahl*60 : zahl;
    const satz = e.time ? 45 : (e.perLeg ? 70 : 40);
    sec += (e.sets || 3) * (satz + pause);
  });
  return Math.round(sec/60/5)*5;
}

function woMeta(x){
  if(x.kind !== 'strength') return x.sub || '';
  return (x.short ? x.short+' · ' : '')+exFor(x, pers()).length+' Übungen · ca. '+dauerVon(x, pers())+' Min.';
}

function relDatum(k){
  const d = daysBetween(k, dkey(new Date()));
  return d === 0 ? 'Heute' : d === 1 ? 'Gestern' : fromKey(k).toLocaleDateString('de-DE',{ weekday:'short', day:'numeric', month:'numeric' });
}

function eintragZeile(e){

    '<span class="chev">›</span></button>';
}

function wocheKarte(){
  const heute = dkey(new Date());
  const wk = laufendeWoche(heute);
  const liste = meineWoche();
  if(!liste.length){
    return '<div class="hero" style="margin-top:20px"><div class="hero-t">Deine Woche ist leer</div>'+
      '<div class="cmeta">Leg fest, welche Trainings du jede Woche machen willst — aus Vorlagen, eigenen oder dem bisherigen Plan.</div>'+
      '<button class="btn btn-primary btn-block btn-lg" data-act="wochewahl">Woche zusammenstellen</button></div>';
  }

  const done = {};
  myEntries().filter(e => e.date >= wk.von && e.date <= wk.bis && e.planId)
             .forEach(e => { if(!done[e.planId] || e.date > done[e.planId]) done[e.planId] = e.date; });
  const offen = liste.filter(x => !done[x.id]);
  const fertig = liste.length - offen.length;

  const label = 'Diese Woche';

  let h = '<div class="week"><div class="spread">'+
      '<span class="tagline" style="margin:0">'+esc(label)+'</span>'+
      '<span class="small muted">'+fertig+' von '+liste.length+' erledigt</span></div>'+
    '<div class="bar g"><i style="width:'+(liste.length ? Math.round(fertig/liste.length*100) : 0)+'%"></i></div></div>';

  const next = offen[0];
  if(next){
    h += '<div class="hero"><div class="tagline">Als Nächstes</div>'+
      '<div class="hero-t">'+esc(next.name)+'</div>'+
      '<div class="cmeta">'+esc(woMeta(next))+'</div>'+
      '<button class="btn btn-primary btn-block btn-lg" data-act="startwo" data-id="'+next.id+'">Training starten</button>'+
    '</div>';
  }else{
    h += '<div class="hero"><div class="hero-t">Woche geschafft</div>'+
      '<div class="cmeta">Alle '+liste.length+' Einheiten erledigt. Ab Montag geht es von vorn los.</div></div>';
  }

  const rest = liste.filter(x => x !== next);
  if(rest.length){
    h += '<div class="list">'+rest.map(x => {
      const d = done[x.id];
      return '<div class="worow'+(d?' fertig':'')+'"><div class="wotxt">'+
        '<div class="won">'+(d?'✓ ':'')+esc(x.name)+'</div>'+
        '<div class="wom">'+esc(d ? 'erledigt · '+relDatum(d) : woMeta(x))+'</div></div>'+
        (d ? '' : '<button class="btn btn-sm" data-act="startwo" data-id="'+x.id+'">Starten</button>')+
      '</div>';
    }).join('')+'</div>';
  }
  return h;
}

/* ============================================================
   HIIT ZUHAUSE — Intervalltraining ohne Geräte, ca. 28 Min.
   8 Übungen im Zirkel, 3 Runden. Steigerung über 6 Stufen:
   erst mehr Arbeit/weniger Pause, dann schwerere Varianten.
   ============================================================ */

const HIIT_UEB = [
  { n:'Kniebeugen',             s:'Sprungkniebeugen',             tipp:'Hüfte nach hinten, Knie nach außen, so tief es sauber geht' },
  { n:'Liegestütze',            s:'Liegestütze, Füße erhöht',     tipp:'Körper gerade wie ein Brett. Auf den Knien ist völlig okay' },
  { n:'Ausfallschritte im Wechsel', s:'Sprung-Ausfallschritte',   tipp:'Hinteres Knie fast bis zum Boden, Oberkörper aufrecht' },
  { n:'Mountain Climber',       s:'Mountain Climber über Kreuz',  tipp:'Hüfte unten halten, Knie zügig zur Brust' },
  { n:'Glute Bridge',           s:'Einbeinige Glute Bridge',      tipp:'Oben den Po fest anspannen. Einbeinig: zur Hälfte Seite wechseln' },
  { n:'Burpees ohne Sprung',    s:'Burpees mit Sprung',           tipp:'Gleichmäßiges Tempo, lieber sauber als hektisch' },
  { n:'Plank mit Schultertippen', s:'Plank auf und ab',           tipp:'Hüfte ruhig halten, nicht hin und her schaukeln' },
  { n:'Hampelmann',             s:'Skater-Sprünge',               tipp:'Locker auf den Fußballen, Arme mitnehmen' }
];
/* arbeit/pause in Sekunden, schwer = schwerere Variante */
const HIIT_STUFEN = [
  { arbeit:30, pause:30, schwer:false },
  { arbeit:35, pause:25, schwer:false },
  { arbeit:40, pause:20, schwer:false },
  { arbeit:40, pause:20, schwer:true  },
  { arbeit:45, pause:15, schwer:true  },
  { arbeit:50, pause:10, schwer:true  }
];
const HIIT_RUNDEN = 3, HIIT_WARM = 120, HIIT_RUNDENPAUSE = 60;

/** Aktuelle Stufe; steigt automatisch, wenn letzte Woche mind. 2× auf dieser Stufe trainiert wurde */
function hiitStufe(){
  S.hiit = S.hiit || {};
  const montag = laufendeWoche(dkey(new Date())).von;
  let st = S.hiit[S.profile];
  if(!st){ st = S.hiit[S.profile] = { stufe:1, seit:montag }; return { st:st, neu:false }; }
  if(st.seit < montag && st.stufe < HIIT_STUFEN.length){
    const n = myEntries().filter(e => e.kind === 'hiit' && e.hiitStufe === st.stufe && e.date >= st.seit && e.date < montag).length;
    if(n >= 2){ st.stufe++; st.seit = montag; st.hoch = montag; save(); }
  }
  return { st:st, neu:st.hoch === montag };
}
function hiitMinuten(){ return Math.round(hiitPhasen(1).reduce((a,p) => a + p.dauer, 0)/60); }
function hiitName(u, stufe){ return HIIT_STUFEN[stufe-1].schwer ? u.s : u.n; }

function hiitKarte(){
  const st = hiitStufe().st;
  return '<div class="worow" style="margin-top:16px"><div class="wotxt"><div class="won">Kein Gym heute? HIIT zuhause</div>'+
    '<div class="wom">ca. '+hiitMinuten()+' Min. · ohne Geräte · Stufe '+st.stufe+'</div></div>'+
    '<button class="btn btn-sm" data-act="hiit">Ansehen</button></div>';
}

function openHiit(){
  const r = hiitStufe(), st = r.st, cfg = HIIT_STUFEN[st.stufe-1];
  const montag = laufendeWoche(dkey(new Date())).von;
  const dieseW = myEntries().filter(e => e.kind === 'hiit' && e.date >= montag).length;
  const aufStufe = myEntries().filter(e => e.kind === 'hiit' && e.hiitStufe === st.stufe && e.date >= st.seit).length;
  let h = sheetHead('HIIT zuhause', 'ca. '+hiitMinuten()+' Min. · 8 Übungen · '+HIIT_RUNDEN+' Runden');
  if(r.neu) h += '<div class="tipp" style="margin:0 0 14px">Neue Woche, neue Stufe! Du bist jetzt auf Stufe '+st.stufe+'.</div>';
  h += '<div class="hstufe"><button class="btn btn-sm" data-act="hiitminus" aria-label="Leichter"'+(st.stufe<=1?' disabled':'')+'>−</button>'+
    '<div><div class="hs-v">Stufe '+st.stufe+' <span class="muted">von '+HIIT_STUFEN.length+'</span></div>'+
    '<div class="hs-k">'+cfg.arbeit+' Sek. Übung · '+cfg.pause+' Sek. Pause'+(cfg.schwer?' · schwere Varianten':'')+'</div></div>'+
    '<button class="btn btn-sm" data-act="hiitplus" aria-label="Schwerer"'+(st.stufe>=HIIT_STUFEN.length?' disabled':'')+'>+</button></div>';
  h += '<div class="sec-title">Ablauf</div>'+
    '<div class="hliste"><div class="hl"><span>2 Min.</span>Aufwärmen</div>'+
    HIIT_UEB.map((u,i) => '<div class="hl"><span>'+(i+1)+'</span>'+esc(hiitName(u, st.stufe))+'</div>').join('')+
    '<div class="hl"><span>×'+HIIT_RUNDEN+'</span>Runden, dazwischen 1 Min. Pause</div></div>';
  h += '<div class="small muted" style="margin:12px 0 4px">Diese Woche '+dieseW+'× gemacht. '+
    (st.stufe < HIIT_STUFEN.length
      ? 'Schaffst du Stufe '+st.stufe+' diese Woche zweimal ('+Math.min(aufStufe,2)+'/2), geht es nächste Woche eine Stufe hoch.'
      : 'Höchste Stufe erreicht. Ziel: in jeder Übung ein paar Wiederholungen mehr.')+'</div>';
  h += '<button class="btn btn-primary btn-block btn-lg" data-act="hiitgo" style="margin-top:14px">Los geht’s</button>';
  openSheet(h);
}
function hiitStufeSetzen(d){
  const st = hiitStufe().st;
  st.stufe = Math.max(1, Math.min(HIIT_STUFEN.length, st.stufe + d)); st.hoch = null;
  st.seit = laufendeWoche(dkey(new Date())).von;
  save(); openHiit(); render();
}

/* ---- Timer ---- */
let hz = null;   // { phasen, i, ende, pause, stufe, start, tick, ton, lock, zuletzt }

function hiitPhasen(stufe){
  const cfg = HIIT_STUFEN[stufe-1], p = [];
  p.push({ typ:'warm', dauer:HIIT_WARM, name:'Aufwärmen', tipp:'Auf der Stelle gehen, Arme kreisen, ein paar lockere Kniebeugen' });
  for(let r = 1; r <= HIIT_RUNDEN; r++){
    HIIT_UEB.forEach((u,i) => {
      p.push({ typ:'arbeit', dauer:cfg.arbeit, name:hiitName(u, stufe), tipp:u.tipp, runde:r, nr:i+1 });
      const letzte = i === HIIT_UEB.length-1;
      if(letzte && r === HIIT_RUNDEN) return;
      p.push({ typ:'pause', dauer:(letzte ? HIIT_RUNDENPAUSE : cfg.pause), name:letzte ? 'Rundenpause' : 'Pause', runde:r, nr:i+1 });
    });
  }
  return p;
}

function hiitStart(){
  const stufe = hiitStufe().st.stufe;
  closeSheet();
  let ton = null;
  try{ ton = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
  hz = { phasen:hiitPhasen(stufe), i:0, stufe:stufe, start:Date.now(), ton:ton, pause:null, lock:null, zuletzt:-1 };
  hz.ende = Date.now() + hz.phasen[0].dauer*1000;
  try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').then(l => { if(hz) hz.lock = l; }).catch(() => {}); }catch(e){}
  $('#hiit').classList.add('open');
  hz.tick = setInterval(hiitTick, 200);
  hiitRender();
}

function piep(freq, ms){
  if(!hz || !hz.ton) return;
  try{
    const o = hz.ton.createOscillator(), g = hz.ton.createGain();
    o.frequency.value = freq; o.connect(g); g.connect(hz.ton.destination);
    g.gain.setValueAtTime(0.25, hz.ton.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, hz.ton.currentTime + ms/1000);
    o.start(); o.stop(hz.ton.currentTime + ms/1000);
  }catch(e){}
}

function hiitTick(){
  if(!hz || hz.pause != null) return;
  const now = Date.now();
  let gewechselt = false;
  while(now >= hz.ende){
    hz.i++; gewechselt = true;
    if(hz.i >= hz.phasen.length){ hiitFertig(); return; }
    hz.ende += hz.phasen[hz.i].dauer*1000;
  }
  const rest = Math.ceil((hz.ende - now)/1000);
  if(gewechselt){
    const ph = hz.phasen[hz.i];
    piep(ph.typ === 'arbeit' ? 880 : 520, ph.typ === 'arbeit' ? 450 : 300);
    try{ if(navigator.vibrate) navigator.vibrate(ph.typ === 'arbeit' ? [200,80,200] : 300); }catch(e){}
  }else if(rest <= 3 && rest >= 1 && rest !== hz.zuletzt){
    piep(660, 120);
  }
  hz.zuletzt = rest;
  hiitRender();
}

function hiitRender(){
  const ph = hz.phasen[hz.i];
  const now = hz.pause != null ? hz.pause : Date.now();
  const rest = Math.max(0, Math.ceil((hz.ende - now)/1000));
  const naechste = hz.phasen.slice(hz.i+1).find(p => p.typ === 'arbeit');
  const gesamt = hz.phasen.reduce((a,p) => a + p.dauer, 0);
  const vorbei = hz.phasen.slice(0, hz.i).reduce((a,p) => a + p.dauer, 0) + (ph.dauer - rest);
  const label = ph.typ === 'arbeit' ? 'Los!' : ph.typ === 'warm' ? 'Aufwärmen' : ph.name;
  const titel = ph.typ === 'arbeit' ? ph.name : (naechste ? 'Gleich: '+naechste.name : 'Gleich geschafft');
  const tipp = ph.typ === 'arbeit' ? ph.tipp : ph.typ === 'warm' ? ph.tipp : (naechste ? naechste.tipp : '');
  $('#hiit').className = 'hiit open h-'+ph.typ;
  $('#hiit').innerHTML =
    '<div class="h-top"><span>'+(ph.runde ? 'Runde '+ph.runde+'/'+HIIT_RUNDEN+' · Übung '+ph.nr+'/'+HIIT_UEB.length : 'Stufe '+hz.stufe)+'</span>'+
      '<span>noch '+fmtDur(gesamt - vorbei)+'</span></div>'+
    '<div class="h-bar"><span style="width:'+(vorbei/gesamt*100).toFixed(1)+'%"></span></div>'+
    '<div class="h-mitte">'+
      '<div class="h-label">'+esc(hz.pause != null ? 'Pausiert' : label)+'</div>'+
      '<div class="h-zahl">'+rest+'</div>'+
      '<div class="h-name">'+esc(titel)+'</div>'+
      (tipp ? '<div class="h-tipp">'+esc(tipp)+'</div>' : '')+
    '</div>'+
    '<div class="h-knoepfe">'+
      '<button class="btn" data-h="stop">Beenden</button>'+
      '<button class="btn btn-primary btn-lg" data-h="pause">'+(hz.pause != null ? 'Weiter' : 'Pause')+'</button>'+
      '<button class="btn" data-h="skip">Weiter ›</button>'+
    '</div>';
}

function hiitAufraeumen(){
  if(!hz) return;
  clearInterval(hz.tick);
  try{ if(hz.lock) hz.lock.release(); }catch(e){}
  try{ if(hz.ton) hz.ton.close(); }catch(e){}
}

function hiitFertig(){
  hiitAufraeumen();
  piep(990, 600);
  const min = Math.round((Date.now() - hz.start)/60000);
  hz.fertig = min;
  $('#hiit').className = 'hiit open h-fertig';
  $('#hiit').innerHTML = '<div class="h-mitte"><div class="h-label">Geschafft!</div>'+
    '<div class="h-name" style="margin-top:6px">HIIT Stufe '+hz.stufe+' · '+min+' Min.</div>'+
    '<div class="h-tipp">Wie war’s? Ein Tipp speichert das Training.</div></div>'+
    '<div class="h-knoepfe h-wahl">'+
      '<button class="btn" data-h="leicht">Zu leicht</button>'+
      '<button class="btn btn-primary btn-lg" data-h="passt">Genau richtig</button>'+
      '<button class="btn" data-h="schwer">Zu schwer</button>'+
    '</div>';
}

function hiitSpeichern(gefuehl){
  const cfg = HIIT_STUFEN[hz.stufe-1];
  const txt = { leicht:'zu leicht', passt:'genau richtig', schwer:'zu schwer' }[gefuehl];
  S.entries.push({ id:uid(), profile:S.profile, date:dkey(new Date()), kind:'hiit', cat:'HIIT zuhause',
    hiitStufe:hz.stufe, duration:Math.max(1, hz.fertig)*60,
    note:'Stufe '+hz.stufe+' · '+cfg.arbeit+'/'+cfg.pause+' · '+txt });
  const st = hiitStufe().st;
  let msg = 'Gespeichert';
  if(gefuehl === 'leicht' && st.stufe < HIIT_STUFEN.length){ st.stufe++; st.seit = laufendeWoche(dkey(new Date())).von; msg = 'Gespeichert · nächstes Mal Stufe '+st.stufe; }
  if(gefuehl === 'schwer' && st.stufe > 1){ st.stufe--; st.seit = laufendeWoche(dkey(new Date())).von; msg = 'Gespeichert · nächstes Mal Stufe '+st.stufe; }
  save();
  $('#hiit').className = 'hiit'; $('#hiit').innerHTML = ''; hz = null;
  render(); toast(msg);
}

$('#hiit').addEventListener('click', e => {
  const t = e.target.closest('[data-h]'); if(!t || !hz) return;
  const a = t.dataset.h;
  if(a === 'pause'){
    if(hz.pause != null){ hz.ende += Date.now() - hz.pause; hz.pause = null; }
    else hz.pause = Date.now();
    hiitRender();
  }else if(a === 'skip'){
    if(hz.pause != null){ hz.ende += Date.now() - hz.pause; hz.pause = null; }
    hz.ende = Date.now(); hiitTick();
  }else if(a === 'stop'){
    if(!confirm('Training beenden? Es wird nicht gespeichert.')) return;
    hiitAufraeumen(); $('#hiit').className = 'hiit'; $('#hiit').innerHTML = ''; hz = null;
  }else if(a === 'leicht' || a === 'passt' || a === 'schwer'){
    hiitSpeichern(a);
  }
});

let alleZeigen = false;

function avgWeight(endKey, days){
  const from = addDays(endKey, -(days-1));
  const vals = S.gewicht.filter(g => g.profile === S.profile && g.date >= from && g.date <= endKey)
                        .map(g => num(g.kg)).filter(v => v != null);
  return vals.length ? { v: vals.reduce((a,b)=>a+b,0)/vals.length, n: vals.length } : null;
}

function gewichtChart(){
  const pts = myGewicht().slice(0,42).reverse();
  if(pts.length < 3) return '';
  const vals = pts.map(g => num(g.kg));
  const min = Math.min.apply(null,vals), max = Math.max.apply(null,vals);
  const span = (max-min) || 1;
  const W = 100, H = 38, p = 3;
  const xy = vals.map((v,i) => [ (i/(vals.length-1))*(W-2*p)+p, H-p - ((v-min)/span)*(H-2*p) ]);
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">'+
    '<polyline class="ln" points="'+xy.map(q=>q[0].toFixed(2)+','+q[1].toFixed(2)).join(' ')+'" vector-effect="non-scaling-stroke"/>'+
    '</svg><div class="small muted">'+fmtNum(min,1)+' – '+fmtNum(max,1)+' kg · letzte '+pts.length+' Messungen</div>';
}

/** Alle Übungen mit Gewicht, die mindestens zweimal gemacht wurden — die häufigsten zuerst */
function kraftListe(){
  const namen = {};
  myEntries().forEach(e => (e.blocks||[]).forEach(b => { if(b.exercise) namen[b.exercise] = true; }));
  return Object.keys(namen).map(n => {
    const hist = lastSessions(S.profile, null, n, 999);
    if(hist.length < 2) return null;
    const w1 = workWeight(hist[hist.length-1].b.sets), w2 = workWeight(hist[0].b.sets);
    if(w1 == null || w2 == null || w1 <= 0) return null;
    return { n:n, anz:hist.length, w1:w1, w2:w2, pct:(w2-w1)/w1*100, unit:hist[0].b.unit };
  }).filter(Boolean).sort((a,b) => b.anz - a.anz);
}

/* ---- Überblick: wie oft und was trainiert wurde ---- */

/** Muskelgruppe einer Übung: aus dem Katalog, sonst nach Stichworten */
const GRUPPE_REGEL = [
  ['Beine',     /nordic/i],
  ['Po',        /hip thrust|glute|abduktion|kickback|donkey|sumo|pulse squat|rumänisch|kreuzheben kurzhantel|seitliches beinheben/i],
  ['Arme',      /curl|trizeps|bank-dips|diamant|enges bank/i],
  ['Beine',     /kniebeuge|squat|beinpresse|beinbeuger|beinstrecker|ausfallschritt|split|step-up|waden|wall sit|adduktion/i],
  ['Rücken',    /rudern|klimmz|latzug|pullover|hyperext|superman|kreuzheben/i],
  ['Schultern', /schulterdr|seitheb|face pull|reverse|frontheb|arnold|pike/i],
  ['Brust',     /bankdr|brustpresse|fly|butterfly|liegestütz|dips/i],
  ['Rumpf',     /plank|pallof|leg raise|crunch|ab wheel|dead bug|twist|climber|seitstütz/i]
];
function gruppeVon(name){
  const k = katEx(name); if(k) return k.g;
  const r = GRUPPE_REGEL.find(x => x[1].test(name));
  return r ? r[0] : null;
}

function ueberblick(){
  const heute = dkey(new Date());
  const es = myEntries();
  const ziel = meineWoche().length;
  const WOCHEN = 8;

  /* Trainings je Woche, älteste zuerst */
  const montag = laufendeWoche(heute).von;
  const wochen = [];
  for(let i = WOCHEN-1; i >= 0; i--){
    const von = addDays(montag, -7*i), bis = addDays(von, 6);
    wochen.push({ von:von, n:es.filter(e => e.date >= von && e.date <= bis).length });
  }
  const dieseWoche = wochen[WOCHEN-1].n;
  /* Schnitt nur über abgeschlossene Wochen ab dem ersten Eintrag */
  const erst = es.reduce((m,e) => !m || e.date < m ? e.date : m, null);
  const fertigeW = wochen.slice(0, -1).filter(w => erst && addDays(w.von, 6) >= erst);
  const schnitt = fertigeW.length ? fertigeW.reduce((a,w) => a + w.n, 0) / fertigeW.length : null;
  /* Wochen in Folge mit mindestens einem Training (laufende Woche zählt mit, wenn schon trainiert) */
  let serie = 0;
  for(let i = (dieseWoche ? 0 : 1); ; i++){
    const von = addDays(montag, -7*i), bis = addDays(von, 6);
    if(es.some(e => e.date >= von && e.date <= bis)) serie++; else break;
    if(i > 520) break;
  }

  let h = '<div class="stats" style="margin-top:18px">'+
    '<div class="stat"><div class="v">'+dieseWoche+(ziel ? '<span class="v2"> / '+ziel+'</span>' : '')+'</div><div class="k">Diese Woche</div></div>'+
    '<div class="stat"><div class="v">'+(schnitt == null ? '–' : fmtNum(schnitt,1)+'×')+'</div><div class="k">Pro Woche im Schnitt</div></div>'+
    '<div class="stat"><div class="v">'+es.filter(e => e.date.startsWith(heute.slice(0,7))).length+'</div><div class="k">Diesen Monat</div></div>'+
    '<div class="stat"><div class="v">'+serie+'</div><div class="k">'+(serie === 1 ? 'Woche' : 'Wochen')+' in Folge aktiv</div></div>'+
  '</div>';

  /* Balken: letzte 8 Wochen */
  const max = Math.max(ziel, ...wochen.map(w => w.n), 1);
  h += '<div class="wbars" role="img" aria-label="Trainings pro Woche, letzte '+WOCHEN+' Wochen">'+
    (ziel ? '<div class="wziel" style="bottom:calc(20px + '+(ziel/max*100)+'px)"><span>Ziel '+ziel+'</span></div>' : '')+
    wochen.map((w,i) =>
      '<div class="wbar'+(i === WOCHEN-1 ? ' jetzt' : '')+(ziel && w.n >= ziel ? ' voll' : '')+'">'+
        '<div class="wsaule" style="height:'+(w.n/max*100)+'%">'+(w.n ? '<span>'+w.n+'</span>' : '')+'</div>'+
        '<div class="wlab">'+(i === WOCHEN-1 ? 'jetzt' : fromKey(w.von).getDate()+'.'+(fromKey(w.von).getMonth()+1)+'.')+'</div>'+
      '</div>').join('')+
  '</div>';

  /* Sätze je Muskelgruppe, letzte 4 Wochen */
  const seit = addDays(heute, -27);
  const saetze = {};
  es.filter(e => e.date >= seit).forEach(e => (e.blocks || []).forEach(b => {
    const g = gruppeVon(b.exercise || ''); if(!g) return;
    saetze[g] = (saetze[g] || 0) + (b.sets || []).length;
  }));
  const gr = KAT_GRUPPEN.map(g => [g, saetze[g] || 0]);
  const gmax = Math.max(...gr.map(x => x[1]), 1);
  if(gr.some(x => x[1])){
    h += '<div class="sec-title" style="margin-top:22px">Sätze je Muskelgruppe · letzte 4 Wochen</div>'+
      gr.map(([g,n]) => '<div class="mg"><span class="mg-n">'+esc(g)+'</span>'+
        '<span class="mg-bar"><span style="width:'+(n/gmax*100)+'%"></span></span>'+
        '<span class="mg-v">'+n+'</span></div>').join('');
  }

  /* Häufigste Trainings, letzte 4 Wochen */
  const arten = {};
  es.filter(e => e.date >= seit).forEach(e => { const c = e.cat || 'Training'; arten[c] = (arten[c] || 0) + 1; });
  const top = Object.entries(arten).sort((a,b) => b[1] - a[1]).slice(0, 4);
  if(top.length){
    h += '<div class="small muted" style="margin-top:10px">Am häufigsten: '+
      top.map(t => esc(t[0])+' '+t[1]+'×').join(' · ')+'</div>';
  }

  /* Kurzer Hinweis */
  const tipps = [];
  if(!es.length) tipps.push('Sobald du Trainings einträgst, siehst du hier, wie oft und was du trainierst.');
  else{
    if(ziel && schnitt != null){
      if(schnitt >= ziel) tipps.push('Du schaffst dein Wochenziel von '+ziel+' Trainings im Schnitt. Stark!');
      else if(schnitt >= ziel - 1) tipps.push('Fast am Ziel: im Schnitt '+fmtNum(schnitt,1)+' von '+ziel+' Trainings pro Woche.');
      else tipps.push('Im Schnitt '+fmtNum(schnitt,1)+' von '+ziel+' Trainings pro Woche. Vielleicht passt eine kürzere Woche besser.');
    }
    const kraftG = gr.filter(x => x[1]).length;
    if(kraftG >= 2){
      const fehlt = gr.filter(x => !x[1] && x[0] !== 'Rumpf').map(x => x[0]);
      if(fehlt.length && fehlt.length <= 3) tipps.push('Seit vier Wochen keine Sätze für '+fehlt.join(', ')+'.');
    }
    const letzt = es.reduce((m,e) => !m || e.date > m ? e.date : m, null);
    const tage = Math.round((fromKey(heute) - fromKey(letzt)) / 864e5);
    if(tage >= 7) tipps.push('Letztes Training vor '+tage+' Tagen. Heute wäre ein guter Tag.');
  }
  if(tipps.length) h += '<div class="tipp">'+tipps.map(esc).join('<br>')+'</div>';
  return h;
}

function renderFortschritt(){
  const heute = dkey(new Date());
  const es = myEntries();

  let h = ueberblick();

  /* Kraft */

          .map(n => '<option value="'+esc(n)+'">'+esc(n)+'</option>').join('')+'</select></div>';
    }
  }

  /* Körpergewicht */
  const g = S.gewicht.find(x => x.profile === S.profile && x.date === heute);
  const vor4 = avgWeight(addDays(heute,-28), 7);
  h += '<h2>Körpergewicht</h2>'+
    '<div class="inline-w">'+
      '<div class="field"><label for="gw">Heute, morgens nüchtern (kg)</label>'+
        '<input id="gw" type="text" inputmode="decimal" value="'+esc(g ? String(g.kg).replace('.',',') : '')+'" placeholder="–"></div>'+
      '<button class="btn btn-primary" data-act="savegw">'+(g?'Ändern':'Speichern')+'</button>'+
    '</div>';
  if(now7 && vor4){
    const d = now7.v - vor4.v;
    h += '<div class="small muted" style="margin-top:10px">'+(d>0?'+':'')+fmtNum(d,1)+' kg gegenüber vor vier Wochen</div>';
  }
  if(now7) h += '<div class="small muted" style="margin-top:6px">7-Tage-Schnitt: '+fmtNum(now7.v,1)+' kg</div>';
  h += gewichtChart();

  /* Umfänge */
  const ms = myMasse();
  h += '<h2>Umfänge</h2>';
  if(ms.length >= 2){
    const jetzt = ms[0], start = ms[ms.length-1];
    const rows = MASSE.map(f => {
      const a = num(start[f.k]), b = num(jetzt[f.k]);
      if(a == null || b == null) return '';
      const d = b - a;
      return '<tr><td>'+esc(f.l)+'</td><td class="r">'+fmtNum(b,1)+' cm <span class="small muted">'+(d>0?'+':'')+fmtNum(d,1)+'</span></td></tr>';
    }).join('');
    if(rows) h += '<table class="t"><tbody>'+rows+'</tbody></table>'+
      '<div class="hint">Veränderung seit '+esc(dShort(start.date))+'</div>';
  }else if(ms.length === 1){
    h += '<div class="hint" style="margin-bottom:10px">Eine Messung vom '+esc(dShort(ms[0].date))+'. Ab der zweiten siehst du die Veränderung.</div>';
  }
  h += '<button class="btn btn-block" data-act="newmass" style="margin-top:10px">+ Messung eintragen</button>';
  if(ms.length){
    h += '<details class="det-plain"><summary>Alle Messungen ('+ms.length+')</summary>'+
      ms.map(m => {
        const bits = MASSE.filter(f => m[f.k]).map(f => f.l.replace('Oberschenkel ','OS ')+' '+fmtNum(num(m[f.k]),1));
        return '<button class="item itemb" data-medit="'+m.id+'"><span class="txt"><span class="t1">'+esc(dShort(m.date))+'</span>'+
          '<span class="t2">'+esc(bits.join(' · ') || 'Keine Werte')+'</span></span><span class="chev">›</span></button>';
      }).join('')+'</details>';
  }

  /* Alle Trainings */
  const alle = es.slice().sort((a,b) => a.date < b.date ? 1 : -1);
  h += '<h2>Alle Trainings</h2>';
  if(!alle.length){
    h += '<div class="empty">Noch keine Trainings eingetragen.</div>';
  }else{
    const zeig = alleZeigen ? alle : alle.slice(0, 10);
    h += zeig.map(eintragZeile).join('');
    if(alle.length > zeig.length)
      h += '<button class="btn-ghost" data-act="showall">Alle '+alle.length+' anzeigen</button>';
  }
  return h;
}

function buildDraft(w, profileId, dateKey, short){
  const person = persOf(profileId);
  let list = exFor(w, person);
  if(short) list = list.slice(0,3);
  return {
    id: uid(), profile: profileId, date: dateKey, kind:'strength',
    planId: w.id, cat: w.name + (w.short ? ' · '+w.short : w.ort ? ' · '+w.ort : ''), note:'',
    blocks: list.map(ex => {
      const t = target(profileId, w, ex, dateKey);
      return {
        exercise: ex.n, unit: ex.unit, perLeg: ex.perLeg, perSide: ex.perSide,
        time: ex.time, noWeight: ex.noWeight, rest: ex.rest, reps: ex.reps, t: t,
        sets: Array.from({length: ex.sets}, () => ({
          reps: '', weight: t.weight != null && !ex.noWeight ? String(t.weight).replace('.',',') : ''
        }))
      };
    })
  };
}

/* ------------------------------------------------------------
   Laufendes Training mitschreiben.
   Auf dem Handy wird die Seite beim Appwechsel jederzeit entladen —
   alles, was nur im Arbeitsspeicher steht, ist dann weg.
   ------------------------------------------------------------ */

function woSichern(){
  try{
    if(!wo || !wo.drafts){ localStorage.removeItem(KEY_WO); return; }
    localStorage.setItem(KEY_WO, JSON.stringify({
      modus:   wo.editId ? 'edit' : 'neu',
      planId:  wo.w.id || '',
      cat:     wo.w.name || '',
      datum:   wo.date,
      kurz:    !!wo.short,
      aktiv:   wo.active,
      editId:  wo.editId || null,
      drafts:  wo.drafts,
      ts:      Date.now()
    }));
  }catch(e){}
}
function woVerwerfen(){ try{ localStorage.removeItem(KEY_WO); }catch(e){} }

function offenesTraining(){
  try{
    const r = localStorage.getItem(KEY_WO);
    if(!r) return null;
    const o = JSON.parse(r);
    if(!o || !o.drafts) return null;
    const hat = Object.keys(o.drafts).some(p =>
      (o.drafts[p].blocks||[]).some(b => (b.sets||[]).some(s => String(s.reps||'').trim() !== '')));
    return hat ? o : null;
  }catch(e){ return null; }
}

function woFortsetzen(){
  const o = offenesTraining();
  if(!o) return;
  if(o.modus === 'edit'){
    const en = S.entries.find(x => x.id === o.editId);
    wo = { w:{ name:o.cat, sub:'', warmup:[], for:[persOf(o.aktiv)], id:o.planId },
           date:o.datum, short:false, drafts:o.drafts, active:o.aktiv, editId:o.editId };
    if(!en){ woVerwerfen(); wo = null; toast('Der zugehörige Eintrag existiert nicht mehr'); return; }
    openEditStrengthAus(wo);
    return;
  }
  const w = woById(o.planId);
  if(!w){ woVerwerfen(); toast('Dieses Training gibt es nicht mehr'); return; }
  wo = { w:w, date:o.datum, short:o.kurz, drafts:o.drafts,
         active: o.drafts[o.aktiv] ? o.aktiv : Object.keys(o.drafts)[0] };
  renderWorkout();
}

function openWorkout(planId, dateKey, short){
  const w = woById(planId);
  if(w.kind !== 'strength'){
    const d = { id:uid(), profile:S.profile, date:dateKey, kind:w.kind, planId:w.id, cat:w.name, note:'' };
    if(w.dur) d.durText = fmtDur(w.dur*60);
    openEntry(d, true);
    return;
  }
  wo = { w:w, date:dateKey, short:!!short, drafts:{} };
  PROFILES.forEach(p => { if(w.for.includes(p.p)) wo.drafts[p.id] = buildDraft(w, p.id, dateKey, short); });
  wo.active = wo.drafts[S.profile] ? S.profile : Object.keys(wo.drafts)[0];
  renderWorkout();
}

function renderWorkout(){
  const w = wo.w;
  const both = Object.keys(wo.drafts).length > 1;

  let h = sheetHead(w.name + (wo.short ? ' · Kurzversion' : ''),
    w.short || w.ort || '');

  if(both){
    h += '<div class="persw">'+ PROFILES.filter(p => wo.drafts[p.id]).map(p =>
      '<button data-wp="'+p.id+'" aria-pressed="'+(wo.active===p.id)+'">'+esc(p.name)+'</button>').join('') +'</div>';
  }

  if(wo.date !== dkey(new Date()))
    h += '<div class="hint" style="margin:-6px 0 12px">Wird für '+esc(dLabel(wo.date))+' eingetragen.</div>';

  if(w.warmup && w.warmup.length){
    h += '<details class="warmup"><summary><strong>Aufwärmen</strong> <span class="muted">· '+w.warmup.length+' Punkte</span></summary><ul>'+
         w.warmup.map(x => '<li>'+esc(x)+'</li>').join('')+'</ul></details>';
  }

  h += '<div id="blocks">'+renderBlocks()+'</div>'+
       '<button class="btn btn-sm" data-act="addex" style="margin-bottom:18px">+ Übung</button>'+
       '<div class="grid2">'+
         '<div class="field"><label for="wo-date">Datum</label>'+
           '<input id="wo-date" type="date" value="'+esc(wo.date)+'" data-chg="wodate"></div>'+
         '<div class="field"><label for="f-note">Notiz</label><input id="f-note" type="text" data-wf="note" value="'+
           esc(wo.drafts[wo.active].note||'')+'"></div>'+
       '</div>'+
       '<button class="btn btn-primary btn-block btn-lg" data-act="savewo" style="margin-top:4px">Training speichern</button>'+
       (both ? '<div class="hint" style="text-align:center">Gespeichert wird für beide, sofern Werte eingetragen sind.</div>' : '');

  openSheet(h);
  woSichern();
}

function renderBlocks(){
  const d = wo.drafts[wo.active];
  return d.blocks.map((b,bi) => {
    const t = b.t || {};
    const nw = b.noWeight;
    const unitLbl = b.time ? 'Sek.' : 'Wdh.'+(b.perLeg?' /Bein':b.perSide?' /Seite':'');
    const wLbl = wLabelOf(b.unit);
    const zielW = t.weight != null ? fmtNum(t.weight,1)+' '+wLbl : null;
    return '<div class="exblock">'+
      '<div class="exhead"><div><span class="name">'+esc(b.exercise)+'</span></div>'+
        (b.rest ? '<span class="rest">'+esc(b.rest)+'</span>' : '')+'</div>'+
      (t.reps ? '<div class="ziel">'+b.sets.length+' × '+t.reps+' '+esc(unitLbl)+
                (zielW && !nw ? ' bei '+esc(zielW) : '')+'</div>' : '')+
      (t.verlauf && t.verlauf.length
        ? '<div class="letzt">Zuletzt '+esc(relDatum(t.verlauf[0].date))+': '+esc(t.verlauf[0].txt)+'</div>'
        : (t.quelle ? '<div class="letzt">Erstes Mal — Gewicht herantasten</div>' : ''))+
      (t.warnung ? '<div class="warn">'+esc(t.warnung)+'</div>' : '')+
      '<div class="setlabels'+(nw?' nw':'')+'"><span></span><span>'+esc(unitLbl)+'</span>'+
        (nw?'':'<span>'+esc(wLbl)+'</span>')+'<span></span></div>'+
      b.sets.map((s,si) =>
        '<div class="setrow'+(nw?' nw':'')+'"><span class="n">'+(si+1)+'</span>'+
        '<input type="text" inputmode="numeric" value="'+esc(s.reps||'')+'" placeholder="'+(t.reps||'')+'" '+
          'data-b="'+bi+'" data-s="'+si+'" data-sf="reps" aria-label="'+esc(unitLbl)+' Satz '+(si+1)+'">'+
        (nw?'':'<input type="text" inputmode="decimal" value="'+esc(s.weight||'')+'" '+
          'data-b="'+bi+'" data-s="'+si+'" data-sf="weight" aria-label="Gewicht Satz '+(si+1)+'">')+
        '<button class="del" data-act="delset" data-b="'+bi+'" data-s="'+si+'" aria-label="Satz löschen">&minus;</button>'+
        '</div>').join('')+
      '<div class="exfoot">'+
        '<button class="btn btn-sm" data-act="addset" data-b="'+bi+'">+ Satz</button>'+
        (t.reps ? '<button class="btn btn-sm" data-act="allziel" data-b="'+bi+'">alle = '+t.reps+'</button>' : '')+
        '<button class="btn-danger btn-sm" data-act="delex" data-b="'+bi+'" style="margin-left:auto">Übung raus</button>'+
      '</div></div>';
  }).join('');
}

function saveWorkout(){
  let n = 0;
  Object.keys(wo.drafts).forEach(pid => {
    const d = wo.drafts[pid];
    const blocks = d.blocks.map(b => ({
      exercise:b.exercise, unit:b.unit, perLeg:b.perLeg, perSide:b.perSide, time:b.time,
      sets:(b.sets||[]).filter(s => String(s.reps).trim() !== '')
    })).filter(b => b.sets.length);
    if(!blocks.length) return;
    S.entries.push({ id:d.id, profile:pid, date:d.date, kind:'strength', planId:d.planId,
                     cat:d.cat, blocks:blocks, note:d.note||'' });
    n++;
  });
  if(!n){ toast('Keine Wiederholungen eingetragen'); return; }
  selDate = wo.date;
  if(!save()) return;          // bei Speicherfehler Formular offen lassen
  woVerwerfen(); closeSheet(); render();
  toast(n > 1 ? 'Für beide gespeichert' : 'Gespeichert');
}

function allCats(){
  const out = [];
  PLAN.workouts.filter(w => (!w.modus || w.modus.indexOf(S.modus) >= 0) && w.for.includes(pers()))
    .forEach(w => out.push({ id:'plan:'+w.id, name:w.name, sub:w.short || w.sub, group:'Aus dem Plan' }));
  EXTRA.filter(w => w.for.includes(pers())).forEach(w => out.push({
    id:'plan:'+w.id, name:w.name,
    sub: exFor(w, pers()).length+' Übungen',
    group: w.ppl ? 'PPL' : w.ort === 'Gym' ? 'Zusatz · Gym' : 'Zusatz · Zuhause'
  }));
  myImported().forEach(w => {
    const ex = exFor(w, pers());
    out.push({ id:'plan:'+w.id, name:w.name,
      sub:(w.ort ? (w.ort === 'Zuhause' ? 'Zuhause · ' : 'Studio · ') : w.plan ? w.plan+' · ' : '')+ex.length+' Übungen',
      group:'Importiert' });
  });
  S.cardio.forEach(c => out.push({ id:'c:'+c.id, name:c.name, kind:'cardio', group:'Cardio' }));
  out.push({ id:'plan:free', name:FREE.name, sub:FREE.sub, group:'Weitere' });
  S.custom.forEach(c => out.push({ id:'x:'+c.id, name:c.name, kind:c.kind, group:'Weitere' }));
  return out;
}

function openPicker(){
  const cats = allCats();
  const pick = c => '<button class="pick" data-cat="'+esc(c.id)+'"><div>'+esc(c.name)+'</div>'+
      (c.sub ? '<div class="p2">'+esc(c.sub)+'</div>' : '')+'</button>';
  let html = sheetHead('Training eintragen', 'Das Datum lässt sich im nächsten Schritt ändern');
  const wIds = meineWoche().map(w => 'plan:'+w.id);
  const woche = wIds.map(id => cats.find(c => c.id === id)).filter(Boolean);
  const rest = cats.filter(c => wIds.indexOf(c.id) < 0);
  if(woche.length) html += '<div class="sec-title">Meine Woche</div>'+woche.map(pick).join('');
  const eigen = rest.filter(c => c.group === 'Importiert');
  if(eigen.length) html += '<div class="sec-title">Eigene Trainings</div>'+eigen.map(pick).join('');
  html += '<div style="height:10px"></div>';
  [['PPL','Push · Pull · Legs'],['Aus dem Plan','Bisheriger Plan'],['Zusatz · Gym','Zusatz im Studio'],['Zusatz · Zuhause','Zusatz zuhause'],['Cardio','Cardio'],['Weitere','Sonstiges']].forEach(([g, titel]) => {
    const items = rest.filter(c => c.group === g);
    if(!items.length) return;
    html += '<details class="det-plain"><summary>'+esc(titel)+'</summary><div style="padding-bottom:6px">'+items.map(pick).join('')+'</div></details>';
  });
  openSheet(html);
}

function openEntry(d, isNew){

  let body = '';
  if(d.kind === 'cardio'){
    body = '<div class="grid2">'+
      '<div class="field"><label for="f-dist">Distanz (km)</label>'+
        '<input id="f-dist" type="text" inputmode="decimal" value="'+esc(d.distance||'')+'" data-f="distance"></div>'+
      '<div class="field"><label for="f-dur">Dauer</label>'+
        '<input id="f-dur" type="text" inputmode="numeric" placeholder="32:15" value="'+esc(d.durText||(d.duration?fmtDur(d.duration):''))+'" data-f="durText"></div>'+
      '</div><div class="field"><div class="hint" id="pace-hint"></div></div>';
  }else{
    body = '<div class="field"><label for="f-dur">Dauer</label>'+
      '<input id="f-dur" type="text" inputmode="numeric" placeholder="1:30:00" value="'+esc(d.durText||(d.duration?fmtDur(d.duration):''))+'" data-f="durText"></div>';
  }
  openSheet(sheetHead(d.cat)+
    '<div class="field"><label for="f-date">Datum</label>'+

function updatePace(){
  const h = $('#pace-hint'); if(!h || !draft) return;
  const p = pace(parseDur(draft.durText), num(draft.distance));
  h.textContent = p ? 'Pace: '+p+' min/km' : 'Distanz und Dauer eintragen für die Pace.';
}

function saveEntry(){
  const d = draft; if(!d) return;
  if(d.kind === 'cardio') d.distance = num(d.distance);
  d.duration = parseDur(d.durText);
  if(d.durText && d.duration == null){ toast('Dauer bitte als 45:00 eingeben'); return; }
  delete d.durText;
  if(d.kind === 'strength' && d.blocks){
    d.blocks = d.blocks.map(b => ({ exercise:b.exercise, unit:b.unit, perLeg:b.perLeg,
      sets:(b.sets||[]).filter(s => String(s.reps).trim() !== '') })).filter(b => b.sets.length);
    if(!d.blocks.length){ toast('Mindestens einen Satz eintragen'); return; }
  }
  const i = S.entries.findIndex(e => e.id === d.id);
  if(i >= 0) S.entries[i] = d; else S.entries.push(d);
  save(); closeSheet(); render(); toast('Gespeichert');
}

/* @@TXT-IMPORT-BEGIN */
/* ============================================================
   12b · TRAININGS AUS TEXT — PARSER
   Reine Funktionen: kein DOM, kein S, keine anderen Helfer.
   tests/txt-import.test.mjs schneidet genau diesen Block aus
   und prüft ihn mit Node. Kein Lookbehind verwenden — ältere
   iOS-Safaris brechen sonst beim Laden der ganzen App ab.
   ============================================================ */

/* Wortende auch vor Umlauten — \b hält „ä" für ein Nicht-Wortzeichen */
const TXT_NB   = '(?=[^0-9A-Za-zÄÖÜäöüß]|$)';
const TXT_ZEIT = 'sekunden|sek\\.?|sec|s|minuten|min\\.?';
const TXT_SATZ = 'sätze|satz|sets?|serien|runden|rounds|durchgänge';
const TXT_WDH  = 'wdh\\.?|wiederholungen|reps?';
const TXT_BIS  = '(?:\\s*(?:-|bis|/)\\s*(\\d{1,3}))?';
const TXT_RE = {
  bullet:  /^(?:[-*•·>–—]+|\d{1,2}[.)])\s+/,
  kopf:    /^(?:(?:tag|day|woche|week|training|einheit)\s*\d+|montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonntag)(?=[^0-9A-Za-zÄÖÜäöüß]|$)/i,
  warm:    /^(?:aufwärmen|aufwärmung|erwärmung|warm-?up)(?=[^0-9A-Za-zÄÖÜäöüß]|$)\s*:?\s*(.*)$/i,
  note:    /^(?:notiz|hinweis|note|info|tipp)\s*:\s*(.+)$/i,
  plan:    /^(?:mein\s+)?(?:trainings)?(?:plan|programm|split)(?=[\s:]|$)\s*:?\s*(.*)$/i,
  pause:   new RegExp('(?:^|\\s)(?:satzpause|pause|rest|ruhe)\\s*:?\\s*(\\d{1,3}(?:[.,]\\d)?)\\s*('+TXT_ZEIT+')?'+TXT_NB, 'i'),
  pause2:  new RegExp('(\\d{1,3}(?:[.,]\\d)?)\\s*('+TXT_ZEIT+')\\s*(?:satzpause|pause|rest)'+TXT_NB, 'i'),
  kg:      new RegExp('@?\\s*(\\d{1,3}(?:[.,]\\d{1,2})?)\\s*kg'+TXT_NB, 'i'),
  perLeg:  /(?:^|\s)(?:(?:pro|je|per)\s+(?:bein|leg)|each\s+leg|einbeinig)(?=[^0-9A-Za-zÄÖÜäöüß]|$)/i,
  perSide: /(?:^|\s)(?:(?:pro|je|per)\s+(?:seite|side|arm)|each\s+side|einarmig)(?=[^0-9A-Za-zÄÖÜäöüß]|$)/i,
  /* 4x8, 4 x 8-10, 3x45 Sek */
  sxr:     new RegExp('(\\d{1,2})\\s*x\\s*(\\d{1,3})'+TXT_BIS+'(?:\\s*('+TXT_WDH+'|'+TXT_ZEIT+'))?'+TXT_NB, 'i'),
  /* 3 Sätze à 10 Wdh, 3 sets of 12, 3 Runden à 45 Sek */
  satzWdh: new RegExp('(\\d{1,2})\\s*(?:'+TXT_SATZ+')'+TXT_NB+'\\s*(?:à|a|zu|je|mit|of|x|,|:)?\\s*(\\d{1,3})'+TXT_BIS+
                      '(?:\\s*('+TXT_WDH+'|'+TXT_ZEIT+'))?'+TXT_NB, 'i'),
  /* 12 Wdh x 3 Sätze */
  wdhSatz: new RegExp('(\\d{1,3})'+TXT_BIS+'\\s*(?:'+TXT_WDH+')'+TXT_NB+'\\s*(?:x|,|in|bei|à)?\\s*(\\d{1,2})\\s*(?:'+TXT_SATZ+')'+TXT_NB, 'i'),
  /* nur Wiederholungen bzw. nur Sekunden → 3 Sätze */
  nurWdh:  new RegExp('(\\d{1,3})'+TXT_BIS+'\\s*('+TXT_WDH+')'+TXT_NB, 'i'),
  nurZeit: new RegExp('(\\d{1,3})'+TXT_BIS+'\\s*(sekunden|sek\\.?|sec|s)'+TXT_NB, 'i'),
  /* Reste nach dem Herausschneiden */
  rest:    new RegExp('(?:^|\\s)(?:'+TXT_SATZ+'|'+TXT_WDH+'|x)'+TXT_NB, 'gi')
};

function txtUnique(name, taken){
  let n = name, i = 2;
  while(taken.indexOf(n) >= 0) n = name+' ('+(i++)+')';
  return n;
}

function txtSplitList(t){
  return String(t || '').split(/\s*[,;·]\s*|\s+\+\s+/).map(x => x.trim()).filter(Boolean);
}

function txtTitle(line){
  return line.replace(/^(?:training|workout|einheit)\s*:\s*/i, '')
             .replace(/\s*:\s*$/, '').replace(/\s*:\s*/g, ' · ')
             .replace(/\s+/g, ' ').trim().slice(0, 60);
}

/** "90" → "90 Sek.", "2" → "2 Min." (ohne Einheit gilt bis 5 als Minuten) */
function txtRest(v, u){
  const n = parseFloat(String(v).replace(',', '.'));
  const min = u ? /^m/i.test(u) : n <= 5;
  return min ? String(n).replace('.', ',')+' Min.' : Math.round(n)+' Sek.';
}

function txtName(s){
  return s.replace(TXT_RE.rest, ' ')
          .replace(/[(\[]\s*[)\]]/g, ' ')
          .replace(/\s+/g, ' ')
          .replace(/(?:\s+(?:à|a|bei|mit|zu|je|@))+\s*$/i, '')
          .replace(/^[\s:,;|@\-.]+|[\s:,;|@\-(]+$/g, '')
          .trim();
}

/** Steigerungsschritt und Gewichtsart aus dem Übungsnamen raten — nur Schlüssel aus PLAN.steps */
function guessExKind(name){
  const s = name.toLowerCase();
  if(/plank|unterarmstütz|crunch|sit-?up|burpee|hampelmann|jumping jack|mountain climber|superman|dead ?bug|bird ?dog|hollow/.test(s))
    return { noWeight:true };
  if(/kurzhantel|\bkh\b|dumbbell/.test(s)) return { step:'kh', unit:'kgSeite' };
  if(/klimmz|pull-?up|chin-?up|dips|liegestütz|push-?up/.test(s)) return { step:'iso', unit:'kgZusatz' };
  if(/beinpresse|leg ?press/.test(s)) return { step:'presse' };
  if(/kniebeuge|squat|kreuzheben|deadlift|hip ?thrust|bankdrücken|bench|langhantel|barbell/.test(s)) return { step:'grund' };
  if(/maschine|machine|kabel|cable|seilzug|latzug|lat ?pull|presse|butterfly|beinbeuger|beinstrecker|abduktion|adduktion/.test(s))
    return { step:'maschine' };
  return { step:'iso' };
}

/** Eine Zeile als Übung lesen. Ohne Satz/Wdh.-Angabe nur mit fallback (dann 3 × 8–12, geschätzt). */
function txtExercise(line, fallback){
  let s = ' '+line.replace(/[×*]/g, 'x').replace(/[–—]/g, '-')+' ';
  const cut = re => {
    const m = s.match(re);
    if(m) s = s.slice(0, m.index)+' '+s.slice(m.index + m[0].length);
    return m;
  };
  const ex = {};
  let m = cut(TXT_RE.pause) || cut(TXT_RE.pause2);
  if(m) ex.rest = txtRest(m[1], m[2]);
  if((m = cut(TXT_RE.kg))) ex.kg = parseFloat(m[1].replace(',', '.'));
  if(cut(TXT_RE.perLeg)) ex.perLeg = true;
  else if(cut(TXT_RE.perSide)) ex.perSide = true;

  let sets = null, lo = null, hi = null, einheit = '';
  if((m = cut(TXT_RE.sxr) || cut(TXT_RE.satzWdh))){
    sets = +m[1]; lo = +m[2]; hi = m[3] ? +m[3] : lo; einheit = m[4] || '';
  }else if((m = cut(TXT_RE.wdhSatz))){
    lo = +m[1]; hi = m[2] ? +m[2] : lo; sets = +m[3];
  }else if((m = cut(TXT_RE.nurWdh) || cut(TXT_RE.nurZeit))){
    sets = 3; lo = +m[1]; hi = m[2] ? +m[2] : lo; einheit = m[3] || '';
  }else if(fallback){
    sets = 3; lo = 8; hi = 12; ex.guessed = true;
  }else return null;
  if(!(sets >= 1) || !(lo >= 1)) return null;
  if(lo > hi){ const t = lo; lo = hi; hi = t; }
  if(/^m/i.test(einheit)){ lo *= 60; hi *= 60; ex.time = true; }
  else if(/^s/i.test(einheit)) ex.time = true;

  const n = txtName(s);
  if(n.length < 2) return null;
  ex.n = n.slice(0, 80);
  ex.sets = Math.min(10, sets);
  ex.reps = [lo, hi];
  if(!ex.rest) ex.rest = '90 Sek.';
  Object.assign(ex, guessExKind(n));
  if(ex.guessed && ex.noWeight && /plank|stütz|halten|hold|wall ?sit/i.test(n)){ ex.time = true; ex.reps = [30,45]; }
  if(ex.time) ex.noWeight = true;
  if(ex.noWeight){ delete ex.step; delete ex.unit; delete ex.kg; }
  return ex;
}

/**
 * Frei geschriebenen Text in Trainings zerlegen.
 * → { workouts:[{ name, plan, note, warmup, ex }], skipped:[Zeilen] }
 */
function parseTrainingText(text, opts){
  opts = opts || {};
  const res = { workouts:[], skipped:[] };
  let cur = null, plan = '', warmMode = false;
  let pend = { warmup:[], note:'' };   // Aufwärmen/Notiz vor der ersten Überschrift

  const neu = name => {
    cur = { name:name, plan:plan, note:pend.note, warmup:pend.warmup, ex:[] };
    pend = { warmup:[], note:'' };
    res.workouts.push(cur);
    warmMode = false;
  };
  /* Überschrift ohne Übungen wieder entfernen, Aufwärmen/Notiz weiterreichen */
  const dropEmpty = () => {
    if(!cur || cur.ex.length) return '';
    res.workouts.pop();
    pend = { warmup:cur.warmup.concat(pend.warmup), note:[cur.note, pend.note].filter(Boolean).join(' ') };
    const name = cur.name; cur = null;
    return name;
  };
  const addNote = t => {
    const z = cur || pend;
    z.note = z.note ? z.note+' '+t : t;
  };
  const addEx = ex => {
    if(!cur) neu(plan || opts.fallbackName || 'Importiertes Training');
    ex.n = txtUnique(ex.n, cur.ex.map(x => x.n));
    cur.ex.push(ex);
    warmMode = false;
  };

  String(text == null ? '' : text).replace(/^﻿/, '').split(/\r\n|\r|\n/).forEach(raw => {
    let line = raw.trim().replace(/^#+\s*/, '').replace(/\*\*|__/g, '').trim();
    if(!line){ warmMode = false; return; }
    const bullet = TXT_RE.bullet.test(line);
    if(bullet) line = line.replace(TXT_RE.bullet, '').trim();
    if(!line) return;
    let m;

    if((m = line.match(TXT_RE.warm))){
      const items = txtSplitList(m[1]);
      const z = cur || pend;
      z.warmup = z.warmup.concat(items);
      warmMode = !items.length;
      return;
    }
    if((m = line.match(TXT_RE.note))){ addNote(m[1].trim()); return; }

    const ex = txtExercise(line, false);
    if(ex){ addEx(ex); return; }

    if(bullet && !TXT_RE.kopf.test(line)){
      if(warmMode){ (cur || pend).warmup.push(line); return; }
      const d = txtExercise(line, true);
      if(d) addEx(d); else res.skipped.push(raw.trim());
      return;
    }
    warmMode = false;

    if(!bullet && (m = line.match(TXT_RE.plan))){
      const leer = dropEmpty();
      if(leer) res.skipped.push(leer);
      plan = txtTitle(m[1] || line);
      return;
    }
    if(line.length > 60 || /[.!?]$/.test(line)){
      if(cur) addNote(line); else res.skipped.push(raw.trim());
      return;
    }

    /* Überschrift eines neuen Trainings */
    const leer = dropEmpty();
    if(leer){
      if(!plan && !res.workouts.length) plan = leer;   // erste leere Überschrift = Name des Plans
      else res.skipped.push(leer);
    }
    neu(txtTitle(line));
  });

  const leer = dropEmpty();
  if(leer) res.skipped.push(leer);
  return res;
}
